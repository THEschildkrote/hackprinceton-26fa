<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isaac</title>
<style>
  /* the site's dark theme in the app's colours. on the near-black surface: ink 17.8:1, secondary 7.1:1;
     yellow is fine as text on dark, and stays a fill under navy text elsewhere. */
  :root {
    --red: #ff4458; --blue: #4d7cff; --navy: #0a1f5c; --yellow: #fcd116; --ink: #f1f3f8;
    --surface: #04060c; --card: rgba(14, 19, 31, .74); --room: #131c33;
    --sec: #8e97ad; --ter: #5f6880; --line: rgba(255, 255, 255, .08); --off: rgba(255, 255, 255, .06);
    --ease: cubic-bezier(.22, 1, .36, 1); --inout: cubic-bezier(.65, 0, .35, 1);
    --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--surface); color: var(--ink); font: 14px/1.35 var(--font); font-variant-numeric: tabular-nums; min-width: 1280px; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  /* app bar, like the site's nav */
  .appbar { position: relative; z-index: 2; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 20px;
            background: rgba(4, 6, 12, .72); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .appbar .title { font-size: 20px; font-weight: 500; letter-spacing: -.04em; margin-right: 6px; }
  .appbar .title span { color: var(--yellow); }
  .appbar .soft { color: var(--sec); }
  .appbar select { height: 34px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, .05); color: var(--ink); padding: 0 14px; max-width: 280px; outline: none; }
  .appbar select option { background: #0b0f1a; color: var(--ink); }
  .appbar .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .appbar .check input { accent-color: var(--yellow); width: 16px; height: 16px; }
  .spacer { flex: 1; }
  .barbtn { height: 34px; border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; background: none; color: var(--ink); cursor: pointer; transition: background .3s; }
  .barbtn:hover { background: rgba(255, 255, 255, .08); }
  .barbtn.quiet { border-color: transparent; color: var(--sec); }
  .barbtn.quiet:hover { color: var(--ink); }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; line-height: 16px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.replay { background: var(--yellow); color: var(--navy); }
  .pill.live { color: #cfe0ff; border: 1px solid rgba(77, 124, 255, .55); padding: 4px 12px; animation: breathe 2.4s ease-in-out infinite; }
  .pill.alert { background: var(--red); color: #fff; }
  .pill.walking { background: var(--blue); color: #fff; }
  .pill.navy { background: rgba(255, 255, 255, .12); color: var(--ink); }
  .pill.idle { background: var(--off); color: var(--sec); }
  .pill.wait { background: var(--yellow); color: var(--navy); }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(77, 124, 255, .45); } 50% { box-shadow: 0 0 0 6px rgba(77, 124, 255, 0); } }

  /* the grid of widgets */
  main { position: relative; z-index: 1; height: calc(100% - 56px); padding: 14px 16px 16px; display: grid; gap: 14px;
         grid-template-columns: minmax(0, 1fr) 460px; grid-template-rows: auto minmax(0, 1fr) 216px; }
  #pipew { grid-column: 1; grid-row: 1; }
  #planw { grid-column: 1; grid-row: 2; }
  #agentsw { grid-column: 1; grid-row: 3; }
  #right { grid-column: 2; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 150px 150px; gap: 14px; flex: none; }
  .w { background: var(--card); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
       border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 48px -28px rgba(0, 0, 0, .7);
       display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; overflow: hidden;
       animation: rise .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
  .w.grow { flex: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.985); } }
  .wh { height: 38px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px;
        border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 500; white-space: nowrap; letter-spacing: -.01em; }
  .wh .meta, .wh .sub { font-weight: 400; font-size: 12px; color: var(--sec); }
  .wh .sub { margin-left: 8px; }
  .wb { flex: 1; min-height: 0; position: relative; }
  .none { padding: 16px; color: var(--sec); }

  .mask { overflow: hidden; }
  .sw { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; animation: up .5s var(--ease); }
  @keyframes up { from { transform: translateY(100%); opacity: 0; } }

  /* pipeline */
  .pipe { display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }
  .stage { padding: 14px 16px 22px; min-width: 0; position: relative; height: 88px; }
  .stage + .stage { border-left: 1px solid var(--line); }
  .stage::before { content: ""; position: absolute; left: 16px; right: 16px; top: 0; height: 2px; background: var(--blue); box-shadow: 0 0 12px rgba(77, 124, 255, .8);
                   transform: scaleX(0); transform-origin: left; transition: transform .7s var(--ease), opacity .7s; opacity: 0; }
  .stage.hot::before { transform: scaleX(1); opacity: 1; transition: transform .25s var(--ease); }
  .stage .k { font-size: 12px; color: var(--sec); }
  .stage .v { font-size: 16px; font-weight: 500; margin-top: 4px; min-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
  .stage .d { font-size: 12px; color: var(--sec); margin-top: 2px; min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 8px; align-items: center; }
  .flow { position: absolute; left: 16px; right: 16px; bottom: 10px; height: 1px; background: repeating-linear-gradient(90deg, rgba(77, 124, 255, .45) 0 6px, transparent 6px 14px); background-size: 14px 1px; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { background-position: 14px 0; } }
  .packet { position: absolute; left: -10px; bottom: 8px; width: 20px; height: 5px; border-radius: 3px; background: var(--blue); box-shadow: 0 0 12px rgba(77, 124, 255, .9); pointer-events: none; }
  .packet.y { background: var(--yellow); box-shadow: 0 0 12px rgba(252, 209, 22, .9); }
  .sh { font-size: 12px; line-height: 16px; padding: 0 8px; border-radius: 999px; background: var(--off); color: var(--sec); transition: background .5s, color .5s, transform .5s var(--ease); }
  .sh.on { background: var(--blue); color: #fff; transform: scale(1.12); transition: none; }

  /* floor plan */
  .seg { display: flex; background: var(--off); border-radius: 999px; padding: 2px; font-weight: 400; }
  .seg button { border: none; background: none; border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--sec); cursor: pointer; transition: background .3s var(--ease), color .3s; }
  .seg button.on { background: rgba(255, 255, 255, .12); color: var(--ink); }
  .plan { background: rgba(255, 255, 255, .015); }
  #plan { position: absolute; inset: 0; width: 100%; height: 100%; }
  #next { position: absolute; left: 14px; top: 14px; z-index: 2; max-width: min(480px, 60%); background: rgba(8, 11, 20, .9); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; backdrop-filter: blur(10px); }
  #next:empty { display: none; }
  #next .k { font-size: 12px; color: var(--sec); }
  #next .t { font-size: 18px; font-weight: 400; letter-spacing: -.02em; }
  #next .t span { color: var(--sec); margin-left: 8px; font-size: 15px; }
  #legend { position: absolute; left: 14px; bottom: 12px; z-index: 2; display: flex; gap: 16px; font-size: 12px; color: var(--sec); background: rgba(8, 11, 20, .85); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; }
  #legend span { display: flex; align-items: center; gap: 8px; }
  #legend i { width: 16px; height: 4px; border-radius: 2px; }
  #legend b { width: 12px; height: 12px; border-radius: 50%; }
  #scale { position: absolute; right: 14px; bottom: 12px; z-index: 2; font-size: 12px; color: var(--sec); text-align: right; }
  #scale i { display: block; height: 4px; border: 1px solid var(--sec); border-top: none; margin: 4px 0 0 auto; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--sec); }
  .facts { flex: none; display: flex; gap: 24px; padding: 0 16px; height: 34px; align-items: center; border-top: 1px solid var(--line); font-size: 12px; overflow: hidden; white-space: nowrap; }
  .facts div { display: flex; gap: 6px; }
  .facts span:first-child { color: var(--sec); }
  .facts span:last-child { font-weight: 500; }
  .ants { animation: ants .9s linear infinite; }
  @keyframes ants { to { stroke-dashoffset: -12; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* trip: thin numbers, like the site's headlines */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); }
  .kpis > div { padding: 10px 16px 12px; }
  .kpis > div + div { border-left: 1px solid var(--line); }
  .kpis .k { font-size: 12px; color: var(--sec); }
  .num { font-size: 30px; font-weight: 200; letter-spacing: -.04em; margin-top: 2px; min-height: 36px; white-space: nowrap; }
  .num small { font-size: 12px; font-weight: 400; color: var(--sec); margin-left: 3px; letter-spacing: 0; }

  /* charts */
  .chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .chart text { font: 11px var(--font); fill: var(--ter); }
  .chart .pop { transform-box: fill-box; transform-origin: center; animation: pop .7s var(--ease) both; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } }
  .chart .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 1.6s ease-out infinite; }
  @keyframes ripple { from { transform: scale(1); opacity: .55; } to { transform: scale(3.4); opacity: 0; } }
  .mix { position: absolute; inset: 0; padding: 8px 16px; display: flex; flex-direction: column; justify-content: space-around; }
  .mr { display: grid; grid-template-columns: 58px 1fr 32px; gap: 8px; align-items: center; font-size: 12px; }
  .mr .ml { color: var(--sec); }
  .mr .mb { height: 6px; background: var(--off); border-radius: 999px; overflow: hidden; }
  .mr .mb i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width .9s var(--ease); }
  .mr .mc { text-align: right; font-weight: 500; }
  .dev { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .dev > div { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 16px; border-top: 1px solid var(--line); min-width: 0; }
  .dev > div:nth-child(-n+2) { border-top: none; }
  .dev > div:nth-child(odd) { border-right: 1px solid var(--line); }
  .dev span:first-child { font-size: 12px; color: var(--sec); }
  .dev span:last-child { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev .off { color: var(--ter); font-weight: 400 !important; }

  /* lists */
  .list { position: absolute; inset: 0; overflow-y: auto; font-size: 12px; }
  .ev { display: grid; grid-template-columns: 56px 64px 1fr; gap: 8px; padding: 0 16px; line-height: 28px; border-top: 1px solid var(--line); }
  .ev:first-child { border-top: none; }
  .ev > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .in { animation: slidein .55s var(--ease); }
  @keyframes slidein { from { opacity: 0; transform: translateX(-10px); background: rgba(252, 209, 22, .16); } 40% { background: rgba(252, 209, 22, .08); } }
  .tm { color: var(--ter); }
  .ev .k { color: var(--sec); }

  /* agents */
  .agents { display: grid; grid-template-columns: 300px minmax(0, 1fr); }
  .agents .latw { position: relative; border-right: 1px solid var(--line); }
  .agents .lw { position: relative; }
  .filters { display: flex; gap: 6px; align-items: center; font-weight: 400; }
  .filters button { border: none; border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; background: var(--off); color: var(--sec); transition: background .25s, color .25s; }
  .filters button.on { background: var(--blue); color: #fff; }
  .row { display: grid; grid-template-columns: 64px 96px 80px 1fr 64px; gap: 8px; padding: 0 16px; line-height: 28px; border-top: 1px solid var(--line); position: relative; }
  .row:first-child { border-top: none; }
  .row > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .ag { font-weight: 500; }
  .row.sub .ag { padding-left: 16px; font-weight: 400; }
  .row .k { color: var(--sec); }
  .row .k .pill { line-height: 16px; padding: 2px 8px; }
  .row .dt span { color: var(--sec); margin-left: 8px; }
  .row .ms { text-align: right; color: var(--ter); }
  .row.err .dt { color: var(--red); }
  .row.run::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--blue), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: scan 1.2s var(--inout) infinite; }
  @keyframes scan { from { background-position: -40% 0; } to { background-position: 140% 0; } }
  .row .more { grid-column: 4 / span 2; white-space: pre-wrap; word-break: break-word; color: var(--sec); line-height: 1.5; padding: 0 0 8px; display: none; }
  .row.open .more { display: block; }
  .row.has { cursor: pointer; }
  .row.has:hover { background: rgba(255, 255, 255, .03); }
  .row.hide { display: none; }

  /* replay dialog */
  dialog { border: 1px solid var(--line); border-radius: 20px; padding: 0; width: 400px; margin: auto; color: var(--ink); background: #0b0f1a; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); }
  dialog[open] { animation: rise .45s var(--ease); }
  dialog::backdrop { background: rgba(0, 0, 0, .55); backdrop-filter: blur(3px); }
  .dh { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 4px; font-size: 22px; font-weight: 300; letter-spacing: -.03em; }
  .form { padding: 8px 18px 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--sec); }
  .field select, .field input { height: 38px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, .05); color: var(--ink); padding: 0 12px; font-size: 15px; outline: none; }
  .field select option { background: #0b0f1a; }
  .field select:focus, .field input:focus { border-color: var(--blue); }
  .actions { grid-column: 1 / span 2; display: flex; gap: 8px; margin-top: 8px; }
  .btn { height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-weight: 500; background: none; color: var(--ink); white-space: nowrap; }
  .btn.primary { background: #e9edf5; color: #11141b; border-color: transparent; flex: 1; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.text { border: none; padding: 0 8px; height: 24px; font-size: 12px; color: var(--sec); }
  .btn.text:hover { color: var(--ink); }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: 4px; } ::-webkit-scrollbar-track { background: transparent; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header class="appbar">
  <a class="title" href="/" aria-label="Isaac, home">isaac<span>.</span></a>
  <select id="sess" aria-label="Session"></select>
  <label class="check soft"><input type="checkbox" id="follow" checked> Follow</label>
  <span class="spacer"></span>
  <button class="barbtn" id="openReplay">Replay</button>
  <span class="pill live" id="mode">Live</span>
  <span class="soft" id="conn">Connecting</span>
  <span class="soft" id="clock"></span>
  <button class="barbtn quiet" id="signout" hidden>Sign out</button>
</header>
<main>
  <section class="w" id="pipew" style="--i:0">
    <div class="pipe" id="pipe">
      <div class="stage" id="st-phone"><div class="k">Phone</div><div class="v mask" id="v-phone"></div><div class="d mask" id="d-phone"></div></div>
      <div class="stage" id="st-pi"><div class="k">Tracker</div><div class="v mask" id="v-pi"></div><div class="d mask" id="d-pi"></div></div>
      <div class="stage" id="st-nav"><div class="k">Navigator</div><div class="v mask" id="v-nav"></div><div class="d mask" id="d-nav"></div></div>
      <div class="stage" id="st-band"><div class="k">Haptics</div><div class="v mask" id="v-band"></div>
        <div class="d"><span class="sh" id="shL">Left</span><span class="sh" id="shR">Right</span></div></div>
      <div class="stage" id="st-voice"><div class="k">Voice</div><div class="v mask" id="v-voice"></div><div class="d mask" id="d-voice"></div></div>
      <div class="flow"></div>
    </div>
  </section>

  <section class="w" id="planw" style="--i:1">
    <div class="wh"><span>Floor plan<span class="sub" id="bld"></span></span><div class="seg" id="floors"></div></div>
    <div class="wb plan">
      <svg id="plan" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Floor plan"></svg>
      <div id="next"></div>
      <div id="legend"><span><i style="background:var(--blue)"></i>Route</span><span><i style="background:rgba(241,243,248,.45)"></i>Walked</span>
        <span><b style="background:var(--red);border:2px solid #fff"></b>Traveller</span>
        <span><b style="background:var(--yellow);border:2px solid var(--navy)"></b>Destination</span>
        <span><b style="background:#0b0f1a;border:2px solid var(--red)"></b>Stall</span></div>
      <div id="scale"></div>
      <div id="empty">No phone connected</div>
    </div>
    <div class="facts" id="facts"></div>
  </section>

  <section class="w" id="agentsw" style="--i:2">
    <div class="wh"><span>Agents</span>
      <div class="filters" id="filters"><span class="meta" id="model"></span>
        <button class="on" data-f="model">Model</button><button class="on" data-f="tool">Tool</button>
        <button class="on" data-f="sub">Subagent</button><button class="on" data-f="hitl">Approval</button></div></div>
    <div class="wb agents">
      <div class="latw"><svg id="c-lat" class="chart" role="img" aria-label="Agent call latency"></svg></div>
      <div class="lw"><div class="list" id="trace"><div class="none">No agent activity</div></div></div>
    </div>
  </section>

  <div id="right">
    <section class="w" style="--i:1">
      <div class="wh"><span>Trip</span><span class="meta" id="state"></span></div>
      <div class="kpis">
        <div><div class="k">Remaining</div><div class="num" id="m-rem"></div></div>
        <div><div class="k">ETA</div><div class="num" id="m-eta"></div></div>
        <div><div class="k">Cadence</div><div class="num" id="m-spm"></div></div>
        <div><div class="k">Reroutes</div><div class="num" id="m-rr"></div></div>
      </div>
    </section>
    <div class="grid2">
      <section class="w" style="--i:2"><div class="wh"><span>Pace</span><span class="meta" id="pace-now"></span></div>
        <div class="wb"><svg id="c-pace" class="chart" role="img" aria-label="Steps per minute"></svg></div></section>
      <section class="w" style="--i:3"><div class="wh"><span>Distance left</span><span class="meta" id="dist-now"></span></div>
        <div class="wb"><svg id="c-dist" class="chart" role="img" aria-label="Distance left over the trip"></svg></div></section>
      <section class="w" style="--i:4"><div class="wh"><span>Activity</span><span class="meta">Last 2 min</span></div>
        <div class="wb"><div class="mix" id="c-mix"></div></div></section>
      <section class="w" style="--i:5"><div class="wh"><span>Devices</span></div>
        <div class="wb"><div class="dev" id="devices"></div></div></section>
    </div>
    <section class="w grow" style="--i:6">
      <div class="wh"><span>Events</span><button class="btn text" id="pause">Pause</button></div>
      <div class="wb"><div class="list" id="events"></div></div>
    </section>
  </div>
</main>
<dialog id="rp" aria-label="Replay">
  <div class="dh"><span>Replay</span><button class="btn text" id="r-close">Close</button></div>
  <div class="form">
    <label class="field">Building<select id="r-sid"><option value="R1FX6EmdcDt">Rabinowitz Hall</option><option value="MgGNVWsyXtH">1255 S Atlantic</option></select></label>
    <label class="field">Speed<select id="r-speed"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option></select></label>
    <label class="field">From<input id="r-start" value="entrance arcade"></label>
    <label class="field">To<input id="r-to" value="seminar room"></label>
    <div class="actions">
      <button class="btn primary" id="r-run">Start</button>
      <button class="btn" id="r-stop">Stop</button>
      <button class="btn" id="r-exc" disabled>Locked door</button>
    </div>
  </div>
</dialog>
<script>
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const C = { red: "#ff4458", blue: "#4d7cff", navy: "#0a1f5c", yellow: "#fcd116", room: "#131c33", sec: "#8e97ad", ter: "#5f6880",

const NEXT = { phone: ["pi"], pi: ["nav"], nav: ["band", "voice"] };
function hot(stage) {
  const e = $("st-" + stage);
  e.classList.add("hot"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("hot"), 180);
  if (REDUCED || document.hidden) return;
  const pipe = $("pipe"), pb = pipe.getBoundingClientRect(), a = e.getBoundingClientRect();
  for (const n of NEXT[stage] || []) {
    const b = $("st-" + n).getBoundingClientRect(), pk = document.createElement("i");
    pk.className = "packet" + (n === "band" ? " y" : "");
    pipe.appendChild(pk);
    const x0 = a.left + a.width / 2 - pb.left, x1 = b.left + b.width / 2 - pb.left;
    pk.animate([{ transform: `translateX(${x0}px) scaleX(.3)`, opacity: 0 }, { opacity: 1, offset: .2 }, { transform: `translateX(${x1}px) scaleX(1)`, opacity: 0 }],
      { duration: 700, easing: "cubic-bezier(.65,0,.35,1)" }).onfinish = () => pk.remove();
  }
}

function renderNext() {
  let html = "";
  if (S.session && S.done) html = `<div class="k">Arrived</div><div class="t">${esc(cap(S.goal))}</div>`;
  else if (S.session && S.next) html = `<div class="k">Next</div><div class="t">${esc(S.next.text || cueName(S.next.cue))}${S.toNext != null ? `<span>${S.toNext.toFixed(1)} m</span>` : ""}</div>`;
  put("next", html);
}

function renderFacts() {
  const b = S.buildings[S.sid] || {}, rows = [], c = b.costar || {};
  $("bld").textContent = b.label || "";
  if (c.year_built) rows.push(["Built", c.year_built]);
  if (c.pre_ada != null) rows.push(["Pre-ADA", c.pre_ada ? "Yes" : "No"]);
  if (c.property_type) rows.push(["Type", c.property_type]);
  if (c.building_class) rows.push(["Class", c.building_class]);
  if (b.entrance) rows.push(["Entrance", b.entrance.step ? `${b.entrance.risers || "Some"} steps${b.entrance.ramp ? ", ramp" : ", no ramp"}` : "Level"]);
  if (S.graph) {
    const doors = S.graph.edges.flatMap(e => e.doors || []);
    if (doors.length) {
      rows.push(["Doorways", new Set(doors.map(d => `${d.x.toFixed(1)},${d.y.toFixed(1)}`)).size]);
      rows.push(["Narrowest", `${Math.min(...doors.map(d => d.width || 9)).toFixed(2)} m`]);
    }
    rows.push(["Floors", S.floors.length]);
    rows.push(["Panoramas", S.graph.nodes.length]);
    const named = new Set(Object.values(S.nodePlace)).size;
    if (named) rows.push(["Places", named]);
  }
  put("facts", rows.length ? rows.map(([k, v]) => `<div><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("") : `<div><span>No building</span></div>`);
}

const ago = s => s < 60 ? "Just now" : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`;
// the traveller this page is about: the one on the followed trip, else the phone that called in last
function traveller() {
  const sess = S.sessions.find(x => x.session === S.session);
  if (sess?.traveller && sess.traveller !== "replay" && S.travellers[sess.traveller]) return sess.traveller;
  return S.devices.find(d => d.role === "phone")?.traveller || null;
}
function renderDevices() {
  const tid = traveller(), dev = role => S.devices.find(d => d.role === role && d.traveller === tid);
  const cell = (d, on, none) => !d ? `<span class="off">${none}</span>` : d.online ? `<span>${on}</span>` : `<span class="off">${ago(d.age_s)}</span>`;
  const n = tid ? S.travellers[tid]?.imessage || 0 : 0, b = S.band;
  const rows = [
    ["Phone", cell(dev("phone"), "Online", "Not connected")],
    ["Caretaker app", cell(dev("care"), "Watching", "Not open")],
    ["iMessage", n ? `<span>${n} paired</span>` : `<span class="off">None paired</span>`],
    ["Haptics", !b?.attached ? `<span class="off">Off</span>` : b.mode === "dry" ? `<span class="off">Dry run</span>` : `<span>${b.mode === "pca" || b.mode === "belt" ? "Belt" : "Collar"}</span>`],
  ];
  put("devices", rows.map(([k, v]) => `<div><span>${k}</span>${v}</div>`).join(""));
  if (S.session) return;
  const ph = dev("phone");
  put("v-phone", ph ? (ph.online ? "Online" : "Offline") : "");
  put("d-phone", ph?.online ? (ph.heading != null ? `Heading ${Math.round(ph.heading)}°` : "Waiting for a trip") : ph ? ago(ph.age_s) : "");
}

function renderTrip(s) {
  const rem = s && s.remaining != null ? s.remaining : null;
  num("m-rem", rem, "m");
  num("m-eta", rem == null ? null : s.done ? 0 : rem / 0.9, "eta");
  num("m-rr", s ? s.reroutes || 0 : null, "int");
  put("state", !s ? "" : statePill(s.done ? "arrived" : (S.hubState || "walking")));
}
function cadenceNow() {
  const now = nowS(), log = S.stepsBy[S.session] || [];
  let n = 0;
  for (let i = log.length - 1; i >= 0 && now - log[i].t < 20000; i--) n += log[i].n;
  return n * 3;
}
function cadence() {
  const live = S.session && !S.done && (S.stepsBy[S.session] || []).some(x => nowS() - x.t < 20000);
  num("m-spm", live ? cadenceNow() : null, "spm");
}
setInterval(cadence, 1000);

// --- charts ---------------------------------------------------------------------------------------
function box(id) {
  const svg = $(id), w = svg.clientWidth, h = svg.clientHeight;
  if (!w || !h) return null;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  return { svg, w, h };
}
const f1 = v => v.toFixed(1);
function gridY(P, w, ys, Y, fmt) {
  return ys.map(v => `<line x1="${P.l}" x2="${w - P.r}" y1="${f1(Y(v))}" y2="${f1(Y(v))}" stroke="${C.grid}"/><text x="${P.l - 6}" y="${f1(Y(v) + 4)}" text-anchor="end">${fmt(v)}</text>`).join("");
}
function emptyNote(b, P, text) {
  return `<text x="${(P.l + b.w - P.r) / 2}" y="${(P.t + b.h - P.b) / 2 + 4}" text-anchor="middle" style="font-size:12px">${text}</text>`;
}

// steps per minute, in 5 s bins, over the last two minutes; the axis runs with the clock
function drawPace() {
  const b = box("c-pace"); if (!b) return;
  const { svg, w, h } = b, now = nowS(), span = 120000, bin = 5000, P = { l: 34, r: 12, t: 12, b: 20 }, iw = w - P.l - P.r, ih = h - P.t - P.b;
  const log = S.stepsBy[S.session] || [], t0 = now - span, first = Math.floor(t0 / bin) * bin, vals = [];
  for (let t = first; t <= now; t += bin) vals.push([t, 0]);
  for (let i = log.length - 1; i >= 0 && log[i].t >= first; i--) { const j = Math.floor((log[i].t - first) / bin); if (vals[j]) vals[j][1] += log[i].n * 60000 / bin; }
  const top = Math.max(120, ...vals.map(v => v[1])) * 1.15;
  const X = t => P.l + (t - t0) / span * iw, Y = v => P.t + ih - v / top * ih;
  let line = "";
  vals.forEach(([t, v], i) => { line += `${i ? "L" : "M"}${f1(X(t))},${f1(Y(v))}L${f1(X(Math.min(t + bin, now)))},${f1(Y(v))}`; });
  const area = `${line}L${f1(X(now))},${P.t + ih}L${f1(X(first))},${P.t + ih}Z`;
  const ys = [0, 60, 120].filter(v => v < top);
  const xl = [[t0, "2 min"], [now - 60000, "1 min"], [now, "Now"]].map(([t, s], i) => `<text x="${f1(X(t))}" y="${h - 5}" text-anchor="${["start", "middle", "end"][i]}">${s}</text>`).join("");
  svg.innerHTML = `<defs><clipPath id="cp-pace"><rect x="${P.l}" y="0" width="${iw}" height="${h}"/></clipPath>
    <linearGradient id="g-pace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.blue}" stop-opacity=".3"/><stop offset="1" stop-color="${C.blue}" stop-opacity="0"/></linearGradient></defs>
    ${gridY(P, w, ys, Y, v => v)}<g clip-path="url(#cp-pace)"><path d="${area}" fill="url(#g-pace)"/><path d="${line}" fill="none" stroke="${C.blue}" stroke-width="1.75" stroke-linejoin="round"/></g>${xl}
    ${log.length ? "" : emptyNote(b, P, "No steps yet")}`;
  put("pace-now", log.length && S.session && !S.done ? `${cadenceNow()} spm` : "");
}

// metres left, from the start of the trip until now
function drawDist() {
  const b = box("c-dist"); if (!b) return;
  const { svg, w, h } = b, P = { l: 34, r: 14, t: 12, b: 20 }, iw = w - P.l - P.r, ih = h - P.t - P.b, log = S.remBy[S.session] || [];
  if (!log.length) { svg.innerHTML = gridY(P, w, [0], v => P.t + ih, () => "0") + emptyNote(b, P, "No trip"); put("dist-now", ""); return; }
  const t0 = log[0].t, end = S.done ? log.at(-1).t : nowS(), t1 = Math.max(end, t0 + 60000), top = Math.max(5, ...log.map(p => p.m)) * 1.12;
  const X = t => P.l + (t - t0) / (t1 - t0) * iw, Y = v => P.t + ih - v / top * ih;
  const pts = log.map(p => [X(p.t), Y(p.m)]);
  if (!S.done) pts.push([X(end), pts.at(-1)[1]]);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${f1(p[0])},${f1(p[1])}`).join("");
  const area = `${line}L${f1(pts.at(-1)[0])},${P.t + ih}L${f1(pts[0][0])},${P.t + ih}Z`, [lx, ly] = pts.at(-1);
  const mid = Math.round(top / 2 / 5) * 5;
  const phase = REDUCED ? 0 : -(performance.now() % 1600);
  svg.innerHTML = `<defs><linearGradient id="g-dist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.blue}" stop-opacity=".18"/><stop offset="1" stop-color="${C.blue}" stop-opacity="0"/></linearGradient></defs>
    ${gridY(P, w, [0, mid].filter((v, i, a) => a.indexOf(v) === i), Y, v => `${v}`)}
    <path d="${area}" fill="url(#g-dist)"/><path d="${line}" fill="none" stroke="${C.ink}" stroke-width="1.75" stroke-linejoin="round"/>
    ${S.done ? "" : `<circle cx="${f1(lx)}" cy="${f1(ly)}" r="4" fill="none" stroke="${C.red}" stroke-width="1.5" class="ripple" style="animation-delay:${phase}ms"/>`}
    <circle cx="${f1(lx)}" cy="${f1(ly)}" r="4" fill="${S.done ? C.yellow : C.red}" stroke="${S.done ? C.navy : "#fff"}" stroke-width="1.5"/>
    <text x="${P.l}" y="${h - 5}">${hm(t0 / 1000)}</text><text x="${w - P.r}" y="${h - 5}" text-anchor="end">${S.done ? hm(end / 1000) : "Now"}</text>`;
  put("dist-now", `${log.at(-1).m.toFixed(1)} m`);
}

// what the system did in the last two minutes, by kind
const MIX = [["step", "Steps", C.blue], ["position", "Position", C.blue], ["maneuver", "Route", C.soft],
  ["voice", "Voice", C.soft], ["band", "Haptics", C.yellow], ["agent", "Agents", C.red]];
function drawMix() {
  const host = $("c-mix");
  if (!host._rows) {
    host.innerHTML = MIX.map(([k, l, c]) => `<div class="mr"><span class="ml">${l}</span><span class="mb"><i style="background:${c}"></i></span><span class="mc">0</span></div>`).join("");
    host._rows = [...host.querySelectorAll(".mr")];
  }
  const cut = nowS() - 120000, n = {};
  for (let i = S.evLog.length - 1; i >= 0 && S.evLog[i].t >= cut; i--) { const k = S.evLog[i].kind === "reroute" ? "maneuver" : S.evLog[i].kind; n[k] = (n[k] || 0) + 1; }
  const max = Math.max(1, ...MIX.map(([k]) => n[k] || 0));
  MIX.forEach(([k], i) => {
    const r = host._rows[i], v = n[k] || 0;
    r.querySelector("i").style.width = `${v / max * 100}%`;
    r.querySelector(".mc").textContent = v;
  });
}

// every model and tool call in the last ten minutes: when, and how long it took
const LATC = { model: C.blue, tool: C.soft, sub: C.yellow, err: C.red };
function drawLat() {
  const b = box("c-lat"); if (!b) return;
  const { svg, w, h } = b, now = nowS(), span = 600000, P = { l: 40, r: 12, t: 26, b: 20 }, iw = w - P.l - P.r, ih = h - P.t - P.b;
  const pts = S.lat.filter(p => now - p.t <= span), top = Math.max(2000, ...pts.map(p => p.ms)) * 1.1;
  const X = t => P.l + (t - (now - span)) / span * iw, Y = v => P.t + ih - Math.sqrt(v / top) * ih;
  const ys = [0, 1000, top > 12000 ? 10000 : 5000].filter(v => v < top);
  const dots = pts.map(p => {
    const fresh = !S.latSeen.has(p.key); if (fresh) S.latSeen.add(p.key);
    return `<circle cx="${f1(X(p.t))}" cy="${f1(Y(p.ms))}" r="${p.kind === "sub" ? 5 : 4}" fill="${LATC[p.kind]}" fill-opacity="${p.kind === "sub" ? 1 : .8}" ${p.kind === "sub" ? `stroke="${C.navy}" stroke-width="1"` : ""}${fresh && !S.quiet ? ` class="pop"` : ""}><title>${esc(p.label)}, ${dur(p.ms)}</title></circle>`;
  }).join("");
  svg.innerHTML = `<text x="14" y="17" style="font-size:12px;font-weight:500;fill:${C.ink}">Latency</text>
    ${[["model", "Model"], ["tool", "Tool"], ["sub", "Subagent"]].reduceRight((acc, [k, l]) => {
      // swatch and navy label: yellow is never text on a light surface
      const x = acc.x - l.length * 6.2 - 14;
      acc.html += `<rect x="${f1(x)}" y="9" width="8" height="8" rx="2" fill="${LATC[k]}"${k === "sub" ? ` stroke="${C.navy}"` : ""}/><text x="${f1(x + 12)}" y="17" style="fill:${C.sec}">${l}</text>`;
      return { x: x - 10, html: acc.html };
    }, { x: w - P.r, html: "" }).html}
    ${gridY(P, w, ys, Y, v => v ? `${v / 1000}s` : "0")}${dots}
    <text x="${P.l}" y="${h - 5}">10 min</text><text x="${w - P.r}" y="${h - 5}" text-anchor="end">Now</text>
    ${pts.length ? "" : emptyNote(b, P, "No agent calls yet")}`;
}

function drawCharts() { drawPace(); drawDist(); drawMix(); drawLat(); }
setInterval(drawPace, 250);
setInterval(() => { drawDist(); drawMix(); drawLat(); }, 1000);

// --- snapshot ---------------------------------------------------------------------------------------
async function snapshot() {
  let snap;
  try { snap = await api("/api/ops/snapshot?events=0"); } catch { return; }
  S.buildings = { ...S.buildings, ...(snap.buildings || {}) };
  put("model", esc(modelName(snap.model)));
  S.band = snap.band; S.devices = snap.devices || []; S.travellers = snap.travellers || {};
  S.stallsBy = snap.stalls || {};
  S.sessions = snap.sessions || [];
  let want = S.session;
  if (S.follow) {
    // a walk in progress first, a real one before a rehearsal, then the latest.
    // a finished rehearsal gives way to a connected phone waiting for its trip.
    const phoneOn = S.devices.some(d => d.role === "phone" && d.online);
    const pool = S.sessions.filter(s => !(phoneOn && s.replay && s.done));
    const rank = s => (s.done ? 0 : 2) + (s.replay ? 0 : 1);
    want = pool.length ? pool.reduce((a, s) => rank(s) >= rank(a) ? s : a).session : null;
  } else if (!S.sessions.find(s => s.session === want)) want = S.sessions.at(-1)?.session || null;
  const sel = $("sess"), opts = S.sessions.map(s => {
    const t = S.started[s.session];
    return `<option value="${esc(s.session)}" title="${esc(s.session)}">${esc(cap(s.goal))}${t ? ", " + hm(t) : ""}${s.replay ? ", replay" : ""}${s.done ? ", done" : ""}</option>`;
  }).join("") || `<option value="">No sessions</option>`;
  if (sel._opts !== opts) { sel.innerHTML = opts; sel._opts = opts; }
  sel.value = want || "";
  const s = S.sessions.find(x => x.session === want);
  if (s) await follow(s);
  else await waiting();
  S.stalls = (S.stallsBy || {})[S.sid] || [];
  drawStalls();
  renderDevices();
  const plan = !!s || !!S.graph;
  $("empty").style.display = plan ? "none" : "flex";
  $("empty").textContent = S.devices.some(d => d.role === "phone" && d.online) ? "Waiting for a trip" : "No phone connected";
  $("legend").style.display = s ? "" : "none";
  $("scale").style.display = plan ? "" : "none";
  const mode = $("mode"), rp = !!s?.replay;
  mode.textContent = rp ? "Replay" : "Live"; mode.className = `pill ${rp ? "replay" : "live"}`;
}

// no trip yet: the plan of the building the phone last walked, if any, so the page is ready
async function waiting() {
  if (S.session) Object.assign(S, { session: null, route: null, trail: [], cur: null, tgt: null, next: null, done: false, goal: null });
  renderTrip(null); $("r-exc").disabled = true;
  const sid = S.travellers[traveller()]?.sid;
  if (sid && sid !== S.sid) await loadBuilding(sid);
  else if (!S.sid) renderFacts();
  drawRoute(); drawMe();
  put("next", S.graph ? `<div class="k">${S.devices.some(d => d.role === "phone" && d.online) ? "Phone online" : "No phone connected"}</div><div class="t">Waiting for a trip</div>` : "");
}

async function follow(s) {
  const fresh = s.session !== S.session;
  if (fresh) {
    // a page opened mid-walk still shows where they have been
    Object.assign(S, { session: s.session, trail: [...(S.walked[s.session] || [])], cur: null, tgt: null, steps: [], stepTotal: 0, hubState: null });
    for (const id of ["v-phone", "d-phone", "v-pi", "d-pi", "v-nav", "d-nav", "v-band", "v-voice", "d-voice"]) put(id, "");
  }
  if (s.sid !== S.sid || !S.graph) await loadBuilding(s.sid);
  else if (!$("bld").textContent) renderFacts();
  Object.assign(S, { route: s.route, next: s.next, toNext: s.to_next, done: s.done, goal: s.goal });
  $("r-exc").disabled = s.done;
  if (s.position) {
    const p = [s.position.x, s.position.y, s.position.floor];
    if (!S.tgt) S.tgt = p;
    if (s.position.heading != null) S.heading = s.position.heading;
    setFloor(p[2]);
  }
  if (s.remaining != null && !(S.remBy[s.session] || []).length) (S.remBy[s.session] = []).push({ t: (S.started[s.session] ? S.started[s.session] * 1000 : nowS()), m: s.remaining });
  renderTrip(s); renderNext();
  if (fresh) { drawStatic(); drawCharts(); } else drawRoute();   // the first draw with a route keeps labels off the destination
}
setInterval(snapshot, 1000);
$("sess").onchange = e => { S.follow = false; $("follow").checked = false; const s = S.sessions.find(x => x.session === e.target.value); if (s) follow(s); };
$("follow").onchange = e => { S.follow = e.target.checked; snapshot(); };

// --- agent trace ----------------------------------------------------------------------------------
const TOOLS = { commit_reroute: "Commit reroute" };
function traceEvent(ev) {
  if (ev.kind === "exception") S.excPhase = ev.phase;
  if (ev.kind === "exception") {
    if (ev.phase === "reported") return row({ ev, agent: "Harness", kind: "Report", detail: esc(cap(ev.text)) });
    if (ev.phase === "fallback") return row({ ev, agent: "Harness", kind: "Fallback", detail: `Rerouted around it<span>${esc(ev.reason || "")}</span>`, more: ev.reason });
    return row({ ev, agent: "Harness", kind: "Answer", detail: ev.pending ? `Waiting on ${esc(TOOLS[ev.pending] || ev.pending)}` : "Agent replied" });
  }
  if (ev.kind !== "agent") return;
  const a = agentName(ev.agent), sub = !!ev.depth;
  switch (ev.event) {
    case "run_start": return row({ ev, agent: a, kind: "Run", detail: `Survey started${ev.goal ? `<span>${esc(ev.goal)}</span>` : ""}` });
    case "run_end": return row({ ev, agent: a, kind: "Run", detail: `Survey finished<span>${ev.model_calls ?? 0} model calls, ${ev.minutes ?? 0} min</span>`, more: ev.reason });
    case "event": return row({ ev, agent: a, kind: "Input", detail: esc(cap(ev.text)) });
    case "model_start": return row({ ev, agent: a, sub, kind: "Model", f: "model", key: ev.run, run: true, detail: `${esc(modelName(ev.model))}<span>Running</span>` });
    case "model_end": return row({ ev, agent: a, sub, kind: "Model", f: "model", key: ev.run, ms: ev.ms, more: ev.text,
      detail: `${esc(modelName(ev.model))}<span>${ev.tool_calls ? esc(ev.tool_calls.join(", ")) : ev.text ? "Reply" : ""}${ev.tokens_in ? `, ${ev.tokens_in} in, ${ev.tokens_out} out` : ""}</span>` });
    case "model_error": return row({ ev, agent: a, sub, kind: "Model", f: "model", key: ev.run, ms: ev.ms, err: true, detail: "Error", more: ev.error });
    case "tool_start": return row({ ev, agent: a, sub, kind: "Tool", f: "tool", key: ev.run, run: true, tool: ev.tool, detail: `${esc(ev.tool)}<span>${esc(ev.args || "")}</span>`, more: ev.args });
    case "tool_end": { const name = S.rows[ev.run]?._tool || "tool";
      return row({ ev, agent: a, sub, kind: "Tool", f: "tool", key: ev.run, ms: ev.ms, tool: name, detail: `${esc(name)}<span>${esc(ev.result || "")}</span>`, more: ev.result }); }
    case "tool_error": return row({ ev, agent: a, sub, kind: "Tool", f: "tool", key: ev.run, ms: ev.ms, err: true, detail: "Error", more: ev.error });
    case "delegate": return row({ ev, agent: a, kind: "Subagent", f: "sub", detail: `${esc(agentName(ev.subagent))}<span>${esc(ev.args || "")}</span>`, more: ev.args });
    case "returned": return row({ ev, agent: a, kind: "Return", f: "sub", ms: ev.ms, detail: `${esc(agentName(ev.subagent))}<span>${esc(ev.result || "")}</span>`, more: ev.result });
    case "hitl_pending": if (S.excPhase === "fallback") return row({ ev, agent: a, kind: "Late", f: "hitl", detail: `${esc(TOOLS[ev.tool] || ev.tool)}<span>Ignored, fallback already applied</span>`, more: ev.args });
      return row({ ev, agent: a, kind: "Approval", f: "hitl", pending: true, detail: `${esc(TOOLS[ev.tool] || ev.tool)}<span>Waiting for traveller</span>`, more: ev.args });
    case "hitl_decision": return row({ ev, agent: a, kind: "Decision", f: "hitl", detail: ev.decision === "approve" ? "Approved" : ev.decision === "reject" ? "Rejected" : esc(cap(ev.decision)) });
    case "say": return row({ ev, agent: a, kind: "Says", detail: esc(ev.text), more: ev.text });
  }
}
function row(o) {
  const box = $("trace");
  if (box.querySelector(".none")) box.innerHTML = "";
  if (o.kind === "Decision") box.querySelectorAll(".row.pending").forEach(r => { r.classList.remove("pending"); const k = r.querySelector(".k"); if (k) k.textContent = "Approval"; });
  let r = o.key && S.rows[o.key];
  const fresh = !r;
  if (fresh) r = document.createElement("div");
  r.className = `row${o.sub ? " sub" : ""}${o.pending ? " pending" : ""}${o.err ? " err" : ""}${o.more ? " has" : ""}${o.run && !S.quiet ? " run" : ""}${fresh && !S.quiet ? " in" : ""}`;
  r.dataset.f = o.f || "";
  if (o.tool) r._tool = o.tool;
  const kind = o.pending ? `<span class="pill wait">${o.kind}</span>` : o.kind;
  r.innerHTML = `<span class="tm">${hms(o.ev.ts)}</span><span class="ag">${esc(o.agent)}</span><span class="k">${kind}</span><span class="dt">${o.detail}</span><span class="ms">${dur(o.ms)}</span>${o.more ? `<div class="more">${esc(o.more)}</div>` : ""}`;
  r.onclick = () => o.more && r.classList.toggle("open");
  r.classList.toggle("hide", !!o.f && !S.filters[o.f]);
  if (o.key) S.rows[o.key] = r;
  if (fresh) {
    const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
    box.appendChild(r);
    while (box.children.length > 400) box.removeChild(box.firstChild);
    if (stick) box.scrollTop = box.scrollHeight;
  }
}
document.querySelectorAll("#filters button").forEach(b => b.onclick = () => {
  const f = b.dataset.f; S.filters[f] = !S.filters[f]; b.classList.toggle("on", S.filters[f]);
  document.querySelectorAll("#trace .row").forEach(r => r.classList.toggle("hide", !!r.dataset.f && !S.filters[r.dataset.f]));
});

// --- event log ------------------------------------------------------------------------------------
const KIND = { step: "Step", position: "Position", maneuver: "Route", reroute: "Reroute", voice: "Voice", band: "Haptics",
  session: "Session", hub: "Status", agent: "Agent", exception: "Problem", replay: "Replay", device: "Device", calibrate: "Calibrate",
  stall: "Stall" };
const kindOf = ev => ev.kind === "voice" ? (ev.who === "traveller" ? "Heard" : "Said") : KIND[ev.kind] || cap(ev.kind);
function describe(ev) {
  switch (ev.kind) {
    case "step": return `${ev.steps} step${ev.steps === 1 ? "" : "s"}${ev.heading_deg != null ? `, heading ${Math.round(ev.heading_deg)}°` : ", no compass"}`;
    case "position": return [placeAt(ev.x, ev.y, ev.floor), floorName(ev.floor), ev.remaining != null ? `${ev.remaining.toFixed(1)} m left` : null, ev.waiting_for ? `on the ${ev.waiting_for}` : null].filter(Boolean).join(", ");
    case "maneuver": case "reroute": return ev.text || cap(ev.type);
    case "voice": return ev.text;
    case "band": return `${cueName(ev.cue)}, ${side(ev.cue).toLowerCase()}${ev.mode === "dry" ? ", dry run" : ""}`;
    case "session": return `To ${cap(ev.goal)}, ${ev.route_m ?? "?"} m, ${ev.profile}${ev.by === "voice" ? ", by voice" : ""}`;
    case "device": return `${ev.role === "care" ? "Caretaker app" : "Phone"} ${ev.phase}${ev.name ? `, ${ev.name}` : ""}`;
    case "calibrate": return `Facing ${Math.round(ev.heading_deg)}°`;
    case "stall": return ev.phase === "detected" ? `${{ stop: "Stopped", backup: "Backed up", shuffle: "Shuffled in place" }[ev.how] || "Stalled"} ${ev.where || ""}, asked`
      : ev.phase === "clear" ? "Nothing in the way, carried on" : `Something in the way: “${ev.text || ""}”`;
    case "hub": return cap([ev.type, ev.state].filter(Boolean).join(", ").replace(/_/g, " "));
    case "agent": return `${agentName(ev.agent)}, ${ev.event.replace(/_/g, " ")}${ev.tool ? " " + ev.tool : ""}${ev.ms != null ? ", " + dur(ev.ms) : ""}`;
    case "exception": return `${cap(ev.phase)}${ev.text ? ", " + ev.text : ""}`;
    case "replay": return ev.phase === "start" ? `Started, ${cap(ev.start)} to ${cap(ev.goal)}, ${ev.lines} steps, ${ev.speed}x` : ev.phase === "end" ? (ev.arrived ? "Ended, arrived" : "Ended") : `Error, ${ev.error}`;
  }
  return "";
}
function logEvent(ev) {
  if (S.paused) return;
  const box = $("events"), d = document.createElement("div");
  d.className = S.quiet ? "ev" : "ev in";
  d.innerHTML = `<span class="tm">${hms(ev.ts)}</span><span class="k">${esc(kindOf(ev))}</span><span>${esc(describe(ev))}</span>`;
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  box.appendChild(d);
  while (box.children.length > 500) box.removeChild(box.firstChild);
  if (stick) box.scrollTop = box.scrollHeight;
}
$("pause").onclick = () => { S.paused = !S.paused; $("pause").textContent = S.paused ? "Resume" : "Pause"; };

// --- live stream ----------------------------------------------------------------------------------
const cut = (a, n) => { if (a.length > n) a.splice(0, a.length - n); };
function remember(ev) {
  const t = ev.ts * 1000;
  if (ev.kind === "session") S.started[ev.session] = ev.ts;
  if (ev.kind === "position" && ev.session) {
    (S.walked[ev.session] ||= []).push([ev.x, ev.y, ev.floor]);
    if (ev.remaining != null) { const r = (S.remBy[ev.session] ||= []); r.push({ t, m: ev.remaining }); cut(r, 4000); }
  }
  if (ev.kind === "step" && ev.session) { const s = (S.stepsBy[ev.session] ||= []); s.push({ t, n: ev.steps || 0 }); cut(s, 4000); }
  S.evLog.push({ t, kind: ev.kind }); cut(S.evLog, 6000);
  if (ev.kind === "agent" && ev.ms != null) {
    const kind = /error/.test(ev.event) ? "err" : ev.event === "returned" ? "sub" : ev.event.startsWith("tool") ? "tool" : "model";
    S.lat.push({ t, ms: ev.ms, kind, key: ev.id, label: `${agentName(ev.agent)} ${ev.tool || modelName(ev.model) || ev.subagent || ""}`.trim() });
    cut(S.lat, 1500);
  }
}
function handle(ev) {
  // the server's clock, from what has just arrived
  const sk = Date.now() - ev.ts * 1000;
  S.skew = S.skew == null || Math.abs(sk - S.skew) > 5000 ? sk : S.skew * .9 + sk * .1;
  remember(ev);
  logEvent(ev);
  const mine = !ev.session || ev.session === S.session;
  switch (ev.kind) {
    case "session": if (S.follow) snapshot(); break;
    case "step": if (!mine) break;
      hot("phone"); S.stepTotal += ev.steps || 0;
      put("v-phone", `${S.stepTotal} steps`);
      put("d-phone", ev.heading_deg != null ? `Heading ${Math.round(ev.heading_deg)}°` : "No compass");
      break;
    case "position": if (!mine) break;
      hot("pi");
      S.tgt = [ev.x, ev.y, ev.floor];
      if (ev.heading != null) S.heading = ev.heading;
      { const last = S.trail.at(-1);
        if (!last || last[2] !== ev.floor || Math.hypot(last[0] - ev.x, last[1] - ev.y) > 0.1) { S.trail.push([ev.x, ev.y, ev.floor]); drawRoute(); } }
      setFloor(ev.floor);
      put("v-pi", esc(placeAt(ev.x, ev.y, ev.floor) || floorName(ev.floor)));
      put("d-pi", esc([floorName(ev.floor), `${(ev.progress ?? 0).toFixed(1)} m walked`, ev.waiting_for ? `on the ${ev.waiting_for}` : ""].filter(Boolean).join(", ")));
      if (ev.remaining != null) { num("m-rem", ev.remaining, "m"); num("m-eta", ev.done ? 0 : ev.remaining / 0.9, "eta"); }
      break;
    case "maneuver": case "reroute": if (!mine) break;
      hot("nav"); put("v-nav", esc(ev.text || cap(ev.type))); put("d-nav", ev.kind === "reroute" ? "Rerouted" : esc(cueName(ev.cue || ev.type)));
      if (ev.kind === "reroute") snapshot();
      break;
    case "voice": if (!mine) break;
      hot("voice"); put("v-voice", esc(ev.who === "traveller" ? `“${ev.text}”` : ev.text)); put("d-voice", ev.who === "traveller" ? "Traveller" : "Isaac");
      break;
    case "calibrate": if (!mine) break;
      hot("phone"); put("d-phone", `Facing ${Math.round(ev.heading_deg)}°`);
      break;
    case "device": snapshot(); break;
    case "stall": if (mine) { hot("nav"); put("v-nav", ev.phase === "detected" ? "Is something in the way?" : ev.phase === "clear" ? "Carry on" : "Finding a way around"); put("d-nav", "Stall"); } snapshot(); break;
    case "band": if (ev.session && !mine) break;
      hot("band"); put("v-band", esc(cueName(ev.cue)));
      for (const [id, on] of [["shL", side(ev.cue) !== "Right"], ["shR", side(ev.cue) !== "Left"]]) {
        const e = $(id); if (!on) continue; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 500);
      }
      break;
    case "hub": if (ev.state) { S.hubState = ev.state; if (S.session) put("state", statePill(S.done ? "arrived" : ev.state)); } break;
    case "replay": if (ev.phase !== "start") snapshot(); break;
    case "agent": case "exception": traceEvent(ev); break;
  }
}
let lastId = 0;
// the stream is fastest, but a tunnel can hold it back; this poll fills in, and ids keep either from repeating
async function poll() {
  let r;
  try { r = await api(`/api/ops/events?since=${lastId}`); } catch { return; }
  if (r.last < lastId) { lastId = 0; return; }   // the server restarted
  for (const ev of r.events || []) { if (ev.id <= lastId) continue; lastId = ev.id; handle(ev); }
}
setInterval(poll, 1000);
function connect() {
  const es = new EventSource(`/api/ops/stream${lastId ? `?since=${lastId}` : ""}`);
  es.onopen = () => { const c = $("conn"); c.textContent = "Connected"; c.className = "soft"; };
  es.onmessage = m => { try { const ev = JSON.parse(m.data); if (ev.id <= lastId) return; lastId = ev.id; handle(ev); } catch (e) { console.warn(e); } };
  es.onerror = () => { const c = $("conn"); c.textContent = "Offline"; c.className = "pill alert"; };
}

// --- replay controls ----------------------------------------------------------------------------------
const ROUTES = { R1FX6EmdcDt: ["entrance arcade", "seminar room"], MgGNVWsyXtH: ["entrance", "Kitchen"] };
$("openReplay").onclick = () => $("rp").showModal();
$("r-close").onclick = () => $("rp").close();
$("rp").onclick = e => { if (e.target === $("rp")) $("rp").close(); };
$("r-sid").onchange = e => { [$("r-start").value, $("r-to").value] = ROUTES[e.target.value]; };
$("r-run").onclick = async () => {
  S.follow = true; $("follow").checked = true;
  $("r-run").disabled = true;
  try {
    await api("/api/ops/replay", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ sid: $("r-sid").value, start: $("r-start").value, to: $("r-to").value, speed: +$("r-speed").value }) });
  } catch (e) {
    logEvent({ ts: Date.now() / 1000, kind: "replay", phase: "error", error: String(e.message).slice(0, 160) });
  }
  $("r-run").disabled = false;
  $("rp").close();
  snapshot();
};
$("r-stop").onclick = () => api("/api/ops/replay/stop", { method: "POST" }).catch(() => {});
$("r-exc").onclick = async () => {
  if (!S.session) return;
  $("r-exc").disabled = true;
  try { await api("/api/nav/exception", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session: S.session, text: "the door is locked" }) }); }
  catch (e) { console.warn(e); }
  $("r-exc").disabled = false;
  snapshot();
};

// --- sign out ---------------------------------------------------------------------------------------
fetch("/api/auth/status").then(r => r.json()).then(s => { $("signout").hidden = !s.required; }).catch(() => {});
$("signout").onclick = () => fetch("/api/auth/logout", { method: "POST" }).finally(() => location.replace("/login.html"));

// --- boot -------------------------------------------------------------------------------------------
(async () => {
  try {
    const snap = await api("/api/ops/snapshot?events=1000"), evs = snap.events || [];
    if (evs.length) S.skew = Date.now() - evs.at(-1).ts * 1000;
    for (const ev of evs) { lastId = Math.max(lastId, ev.id); remember(ev); }
    await snapshot();   // the building first, so history rows get place names
    S.quiet = true;     // history goes in without the arrival animations
    for (const ev of evs) { logEvent(ev); traceEvent(ev); }
    drawCharts();
    S.quiet = false;
  } catch { S.quiet = false; await snapshot(); }
  drawCharts();
  connect();
})();
</script>
</body>
