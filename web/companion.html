<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nudge Companion</title>
<style>
  :root {
    --bg: #000; --fg: #fff; --accent: #ffd400; --muted: #bdbdbd; --panel: #141414; --line: #3a3a3a;
    --ok: #39d353; --bad: #ff6b6b; --motor-off: #2b2b2b;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #fff; --fg: #000; --accent: #0033cc; --muted: #444; --panel: #f2f2f2; --line: #999;
      --ok: #0a7a2a; --bad: #b00020; --motor-off: #d8d8d8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 20px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 28px; margin: 4px 0 12px; }
  .say { background: var(--panel); border: 3px solid var(--accent); border-radius: 14px; padding: 18px; min-height: 120px;
         font-size: 26px; font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 14px 0; }
  button { min-height: 72px; font: inherit; font-weight: 700; border-radius: 14px; border: 3px solid var(--fg);
           background: var(--panel); color: var(--fg); cursor: pointer; padding: 10px; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button[aria-pressed="true"] { outline: 4px solid var(--accent); }
  button:focus-visible, input:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .5; }
  label { display: block; font-size: 16px; color: var(--muted); margin-top: 10px; }
  input { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 2px solid var(--line);
          background: var(--panel); color: var(--fg); }
  .status { font-size: 16px; color: var(--muted); margin: 8px 0; }
  .status b.ok { color: var(--ok); } .status b.bad { color: var(--bad); }
  .warn { border: 2px solid var(--bad); color: var(--fg); border-radius: 10px; padding: 12px; font-size: 17px; margin: 10px 0; }
  .band { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--panel);
          border-radius: 14px; padding: 18px; margin: 14px 0; }
  .motor { width: 84px; height: 84px; border-radius: 50%; background: var(--motor-off); display: grid; place-items: center;
           font-weight: 800; font-size: 22px; color: var(--muted); transition: background 40ms; }
  .motor.on { background: var(--accent); color: var(--bg); box-shadow: 0 0 24px var(--accent); }
  .mid { text-align: center; font-family: ui-monospace, Consolas, monospace; font-size: 18px; word-break: break-all; }
  details { margin-top: 16px; } summary { cursor: pointer; font-size: 18px; min-height: 44px; }
  pre { font-size: 14px; background: var(--panel); padding: 10px; border-radius: 10px; overflow-x: auto; max-height: 220px; }
  .sr { position: absolute; left: -9999px; }
</style>
</head>
<body>
<main>
  <h1>Nudge companion</h1>
  <div class="say" id="say" aria-live="assertive" aria-atomic="true">Not started.</div>
  <p class="status" id="status" aria-live="polite">Band: <b class="bad">not connected</b> · Server: <b class="bad">idle</b></p>
  <div id="btwarn" class="warn" hidden></div>

  <div class="row">
    <button id="repeat" class="primary" aria-label="Repeat the current step">Repeat</button>
    <button id="lost" aria-label="I'm lost. Find me a new route">I'm lost</button>
  </div>
  <div class="row">
    <button id="connect" aria-label="Connect the Nudge band over Bluetooth">Connect band</button>
    <button id="sim" aria-pressed="false" aria-label="Simulate the band on screen">Simulate band</button>
  </div>

  <div class="band" aria-hidden="true">
    <div class="motor" id="mL">L</div>
    <div class="mid" id="line">—</div>
    <div class="motor" id="mR">R</div>
  </div>

  <div class="row">
    <button id="follow" class="primary">Follow my latest trip</button>
    <button id="stop">Stop</button>
  </div>
  <p id="followmsg" aria-live="polite"></p>
  <details>
    <summary>Advanced</summary>
    <label for="server">Server</label>
    <input id="server" autocomplete="off" inputmode="url">
    <label for="session">Trip (or "stub" for an offline demo)</label>
    <input id="session" autocomplete="off" placeholder="filled in automatically">
    <button id="start">Start this trip</button>
  </details>

  <details>
    <summary>Lines sent to the band</summary>
    <pre id="log"></pre>
  </details>
</main>

<script>
// keep in sync with firmware/nudge_band/nudge_band.ino
const SERVICE = "7a6e0001-1d6e-4c1a-9b5e-6e7564676500";
const RX = "7a6e0002-1d6e-4c1a-9b5e-6e7564676500";
const TX = "7a6e0003-1d6e-4c1a-9b5e-6e7564676500";
const POLL_MS = 500;

// offline stub: a real walk on the synthetic building (K3 -> Office, blind), generated by the navigator
const STUB = {"route": ["0,D,S,0,0.0", "1,B,R,-48,6.0", "2,T,L,90,4.5", "3,A,S,0,3.0"], "frames": [["N,5.3,10,BR,0", "Walk 6 meters, then bear right."], ["N,4.6,-1,BR,0", "Walk 6 meters, then bear right."], ["N,3.9,8,BR,0", "Walk 6 meters, then bear right."], ["N,3.2,2,BR,0", "Walk 6 meters, then bear right."], ["N,2.6,-39,BR,0", "Walk 6 meters, then bear right."], ["N,1.9,-18,BR,0", "Walk 6 meters, then bear right."], ["N,1.3,-22,BR,0", "Walk 6 meters, then bear right."], ["N,0.6,-41,BR,0", "Walk 6 meters, then bear right."], ["N,4.3,-46,TL,0", "Walk 4.5 meters, through a doorway, into the lobby, then turn left."], ["N,3.9,10,TL,0", "Walk 4.5 meters, through a doorway, into the lobby, then turn left."], ["N,3.2,-18,TL,0", "Walk 4.5 meters, through a doorway, into the lobby, then turn left."], ["N,2.6,1,TL,0", "Walk 4.5 meters, through a doorway, into the lobby, then turn left."], ["N,1.9,-13,TL,0", "Walk 4.5 meters, through a doorway, into the lobby, then turn left."], ["N,1.3,10,TL,0", "Walk 4.5 meters, through a doorway, into the lobby, then turn left."], ["N,0.6,48,TL,0", "Walk 4.5 meters, through a doorway, into the lobby, then turn left."], ["N,3.0,90,AS,0", "Walk 3 meters, through a doorway, into the office, and you're there."], ["N,2.4,-5,AS,0", "Walk 3 meters, through a doorway, into the office, and you're there."], ["N,1.8,-14,AS,0", "Walk 3 meters, through a doorway, into the office, and you're there."], ["N,1.2,,AS,2", "Walk 3 meters, through a doorway, into the office, and you're there."]]};

const $ = (id) => document.getElementById(id);
let userTapped = false;
addEventListener("pointerdown", () => { userTapped = true; }, { once: true });
addEventListener("keydown", () => { userTapped = true; }, { once: true });
const st = { rx: null, connected: false, sim: false, timer: null, seq: -1, said: "", reroutes: -1, stubI: 0, sending: Promise.resolve() };

// ---------- the band's haptic grammar, ported from firmware/nudge_band/haptics.h ----------
const L = 1, R = 2, BOTH = 3;
const CUES = {
  left: [[120, 80, L], [120, 0, L]],
  right: [[120, 80, R], [120, 80, R], [120, 0, R]],
  bear_left: [[60, 60, L], [120, 0, L]],
  bear_right: [[60, 60, R], [120, 60, R], [120, 0, R]],
  uturn: [[400, 100, BOTH], [400, 0, BOTH]],
  floor: [[200, 100, BOTH], [200, 100, BOTH], [200, 0, BOTH]],
  arrive: [[60, 60, BOTH], [60, 60, BOTH], [300, 0, BOTH]],
  hazard: Array(5).fill([30, 30, BOTH]),
  unmapped: [[600, 0, BOTH]],  // off the map: slow, both sides (repeats while unmapped on the band)
  off_route: [[500, 0, BOTH]],
  straight: [[60, 0, BOTH]],
};
function approachCue(act, dir) {
  if (act === "T") return dir === "L" ? "left" : dir === "R" ? "right" : null;
  if (act === "B") return dir === "L" ? "bear_left" : dir === "R" ? "bear_right" : null;
  if (act === "U") return "uturn";
  if (act === "F") return "floor";
  return null;
}
function parseLive(line) {
  const f = line.trim().split(",");
  if (f[0] !== "N" || f.length !== 5) return null;
  const fl = parseInt(f[4], 10) || 0;
  return { m: f[1] === "" ? null : parseFloat(f[1]), deg: f[2] === "" ? null : parseInt(f[2], 10),
           act: f[3][0], dir: f[3][1], off: !!(fl & 1), done: !!(fl & 2), unmapped: !!(fl & 4), hazard: !!(fl & 8) };
}
const eng = { pat: null, idx: 0, on: true, t0: 0, live: null, wasOff: false, wasDone: false, wasHaz: false,
              tapped: false, lastAct: "", lastDir: "", steer0: 0 };
function play(cue) {
  const p = CUES[cue]; if (!p) return;
  Object.assign(eng, { pat: p, idx: 0, on: true, t0: performance.now() });
  // phone fallback when no band is connected: same rhythm, no sides
  // chrome blocks vibrate until the user has tapped the page once
  if (!st.connected && navigator.vibrate && userTapped) {
    const ms = p.flatMap(([a, b]) => [a, b]);
    if (ms[ms.length - 1] === 0) ms.pop();
    try { navigator.vibrate(ms); } catch (e) {}
  }
}
function onLive(l) {
  if (l.off && !eng.wasOff) play("off_route"); eng.wasOff = l.off;
  if (l.done && !eng.wasDone) play("arrive"); eng.wasDone = l.done;
  if (l.hazard && !eng.wasHaz) play("hazard"); eng.wasHaz = l.hazard;
  if (l.unmapped && !eng.wasUnm) play("unmapped"); eng.wasUnm = l.unmapped;
  if (l.act !== eng.lastAct || l.dir !== eng.lastDir || (l.m !== null && l.m > 3)) eng.tapped = false;
  eng.lastAct = l.act; eng.lastDir = l.dir;
  if (!eng.tapped && !l.done && l.m !== null && l.m < 2) {
    const c = approachCue(l.act, l.dir); if (c) { play(c); eng.tapped = true; }
  }
  eng.live = l;
}
function steerPeriod(deg) {
  const a = Math.abs(deg); if (a <= 15) return 0; if (a >= 90) return 300;
  return 1200 - (a - 15) * Math.floor(900 / 75);
}
function tick(now) {
  if (eng.pat) {
    for (;;) {
      const [on, off, m] = eng.pat[eng.idx];
      const dur = eng.on ? on : off;
      if (now - eng.t0 < dur) return eng.on ? m : 0;
      eng.t0 += dur;
      if (eng.on) { eng.on = false; continue; }
      if (++eng.idx >= eng.pat.length) { eng.pat = null; eng.steer0 = now; break; }
      eng.on = true;
    }
  }
  const l = eng.live;
  if (!l || l.done || l.off || l.deg === null) return 0;
  const p = steerPeriod(l.deg); if (!p) return 0;
  if (now - eng.steer0 >= p) eng.steer0 += p * Math.floor((now - eng.steer0) / p);
  return now - eng.steer0 < 40 ? (l.deg > 0 ? L : R) : 0;
}
function frame(now) {
  const m = st.sim ? tick(now) : 0;
  $("mL").classList.toggle("on", !!(m & L));
  $("mR").classList.toggle("on", !!(m & R));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- speech ----------
function say(text, force) {
  if (!text || (!force && text === st.said)) return;
  st.said = text;
  $("say").textContent = text;
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }
}

// ---------- status + log ----------
function status() {
  const band = st.connected ? '<b class="ok">connected</b>' : st.sim ? '<b class="ok">simulated</b>' : '<b class="bad">not connected</b>';
  const srv = st.timer ? (isStub() ? '<b class="ok">stub demo</b>' : '<b class="ok">polling</b>') : '<b class="bad">idle</b>';
  $("status").innerHTML = `Band: ${band} · Server: ${srv}`;
}
function log(line) {
  const el = $("log");
  el.textContent = (line + "\n" + el.textContent).split("\n").slice(0, 80).join("\n");
}

// ---------- bluetooth ----------
function btProblem() {
  if (!("bluetooth" in navigator)) {
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    return ios ? "iPhone browsers don't support Web Bluetooth. Use Android Chrome for the band, or turn on Simulate band."
               : "This browser has no Web Bluetooth. Use Chrome on Android or desktop, or turn on Simulate band.";
  }
  if (!window.isSecureContext) return "Web Bluetooth needs https or localhost.";
  return null;
}
async function connect() {
  const p = btProblem(); if (p) { $("btwarn").hidden = false; $("btwarn").textContent = p; return; }
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
    dev.addEventListener("gattserverdisconnected", () => { st.connected = false; st.rx = null; status(); say("Band disconnected.", true); });
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(SERVICE);
    st.rx = await svc.getCharacteristic(RX);
    const tx = await svc.getCharacteristic(TX);
    await tx.startNotifications();
    tx.addEventListener("characteristicvaluechanged", (e) => {
      const msg = new TextDecoder().decode(e.target.value).trim();
      if (msg === "B,repeat") repeat(); else if (msg === "B,lost") lost();
    });
    st.connected = true; status(); say("Band connected.", true);
    st.reroutes = -1;  // resend the route
  } catch (err) {
    $("btwarn").hidden = false; $("btwarn").textContent = "Couldn't connect to the band: " + err.message;
  }
}
function send(line) {
  log(line);
  $("line").textContent = line;
  if (!st.rx) return;
  const data = new TextEncoder().encode(line);
  // serialize writes; gatt allows one operation at a time
  st.sending = st.sending.then(() => (st.rx.writeValueWithoutResponse || st.rx.writeValue).call(st.rx, data)).catch(() => {});
}

// ---------- server ----------
const isStub = () => $("session").value.trim().toLowerCase() === "stub";
const base = () => $("server").value.replace(/\/+$/, "");
const api = (path, opt) => fetch(`${base()}/api/device/${encodeURIComponent($("session").value.trim())}${path}`, opt)
  .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });

async function poll() {
  try {
    let live;
    if (isStub()) {
      if (st.reroutes < 0) { STUB.route.forEach(send); st.reroutes = 0; }
      const [line, text] = STUB.frames[Math.min(st.stubI++, STUB.frames.length - 1)];
      live = { line, seq: st.stubI, say: text, reroutes: 0 };
      if (st.stubI > STUB.frames.length + 6) { st.stubI = 0; st.reroutes = -1; eng.wasDone = false; }
    } else {
      live = await api("/live");
      if (live.reroutes !== st.reroutes) {
        const r = await api("/route");
        r.lines.forEach(send);
        st.reroutes = live.reroutes;
      }
    }
    if (live.seq !== st.seq) {
      st.seq = live.seq;
      send(live.line);
      const l = parseLive(live.line);
      if (l) onLive(l);
    }
    const l = parseLive(live.line);
    say(l && l.done ? "You have arrived." : live.say);
  } catch (err) {
    $("status").innerHTML = `Server: <b class="bad">${err.message}</b>`;
  }
}
function start() {
  stop();
  if (!$("session").value.trim()) { say("No trip yet. Start one in the Nudge app or voice page, then tap Follow my latest trip.", true); return; }
  try { localStorage.setItem("nudge.server", $("server").value); localStorage.setItem("nudge.session", $("session").value); } catch (e) {}
  st.seq = -1; st.reroutes = -1; st.stubI = 0; st.said = "";
  poll(); st.timer = setInterval(poll, isStub() ? 900 : POLL_MS); status();
}
function stop() { clearInterval(st.timer); st.timer = null; status(); }

async function repeat() {
  if (isStub() || !$("session").value.trim()) { say(st.said || "No step yet.", true); return; }
  try { say((await api("/button", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ event: "repeat" }) })).say, true); }
  catch (err) { say(st.said || "No step yet.", true); }
}
async function lost() {
  play("off_route"); if (st.connected) send("C,off_route");
  if (isStub()) { say("Let me find you. New route, about 10 meters.", true); return; }
  try { say((await api("/button", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ event: "lost" }) })).say, true); }
  catch (err) { say("I couldn't reach the server. Stay where you are.", true); }
}

// ---------- follow the latest trip ----------
function travellerId() {
  const q = new URLSearchParams(location.search);
  let t = q.get("traveller");
  if (!t) { try { t = localStorage.getItem("nudge.traveller"); } catch (e) {} }
  return t || "maya";
}
let followTimer = null;
async function follow(quiet) {
  const tid = travellerId();
  try {
    const r = await fetch(`${base()}/api/traveller/${encodeURIComponent(tid)}/status`);
    const j = r.ok ? await r.json() : null;
    if (!j || !j.session) { if (!quiet) $("followmsg").textContent = "No trip yet. Start one in the Nudge app or voice page; this page picks it up."; return; }
    if (j.session !== $("session").value.trim() || !st.timer) {
      $("session").value = j.session;
      $("followmsg").textContent = j.goal ? `Following the trip to ${j.goal}.` : "Following your trip.";
      start();
    }
  } catch (e) { if (!quiet) $("followmsg").textContent = "Can't reach the Nudge server."; }
}
function startFollowing() { follow(false); clearInterval(followTimer); followTimer = setInterval(() => follow(true), 3000); }

// ---------- wiring ----------
let saved = {};
try { saved = { server: localStorage.getItem("nudge.server"), session: localStorage.getItem("nudge.session") }; } catch (e) {}
$("server").value = saved.server || (location.protocol.startsWith("http") ? location.origin : "http://localhost:8765");
const q = new URLSearchParams(location.search);
$("session").value = q.get("session") || saved.session || "";
$("repeat").onclick = repeat;
$("lost").onclick = lost;
$("connect").onclick = connect;
$("start").onclick = start;
$("follow").onclick = startFollowing;
$("stop").onclick = () => { clearInterval(followTimer); stop(); $("followmsg").textContent = "Stopped."; };
$("sim").onclick = () => { st.sim = !st.sim; $("sim").setAttribute("aria-pressed", st.sim); status(); };
if (q.get("sim") === "1") $("sim").click();
const p = btProblem(); if (p) { $("btwarn").hidden = false; $("btwarn").textContent = p; }
if (q.get("session")) start(); else startFollowing();
status();
</script>
</body>
</html>
