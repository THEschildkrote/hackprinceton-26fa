<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nudge Dossier Agent</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #d9d9d3;
    --wall: #2a2a28; --door: #0f8b8d; --edge: #c4c4bc; --hazard: #d23c3c; --room: #e9e6dc;
    --lead: #2f6fde; --scout: #d23c3c; --writer: #0f8b8d; --site: #7b4bc4; --ok: #1f9d55; --look: #e08a1e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --ink: #ecece6; --muted: #9a9a92; --line: #33332f;
      --wall: #e6e6df; --edge: #4a4a44; --room: #2a2925;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecece6; --muted: #9a9a92; --line: #33332f;
    --wall: #e6e6df; --edge: #4a4a44; --room: #2a2925;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  header a { color: var(--lead); font-size: 13px; margin-left: auto; }
  label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); font-size: 13px; }
  input, select, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                          border-radius: 6px; padding: 4px 8px; }
  input[type=text] { width: 120px; }
  button { cursor: pointer; }
  button.primary { background: var(--lead); color: #fff; border-color: var(--lead); }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; height: calc(100vh - 52px); }
  #left { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
  #mapwrap { position: relative; min-height: 0; }
  svg { width: 100%; height: 100%; display: block; }
  #briefing { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; max-height: 32vh; overflow: auto; }
  #briefing p { margin: 6px 0 0; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 12px 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 6px; }
  h2:first-child { margin-top: 0; }
  #status { font-size: 13px; color: var(--muted); }
  #status.err { color: var(--hazard); }
  #plan ol { margin: 0; padding-left: 0; list-style: none; }
  #plan li { padding: 2px 0; display: flex; gap: 6px; }
  #plan li .m { width: 16px; flex: none; text-align: center; }
  #plan li.completed { color: var(--muted); text-decoration: line-through; }
  #plan li.in_progress { font-weight: 600; }
  #plan .count { float: right; font-size: 12px; color: var(--muted); }
  .row { font-size: 12.5px; padding: 3px 0 3px 8px; border-left: 2px solid var(--line); margin: 2px 0; }
  .row.write { border-color: var(--ok); }
  .row.look { border-color: var(--look); }
  .row.say { border-color: var(--lead); font-style: italic; }
  .row.error { border-color: var(--hazard); color: var(--hazard); }
  .row code { font-size: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; background: var(--bg); }
  .card .who { font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .card .who i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .card .desc { font-size: 12.5px; color: var(--muted); margin: 2px 0 4px; }
  .card .res { font-size: 12.5px; margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); }
  .card.running { box-shadow: 0 0 0 2px color-mix(in srgb, var(--lead) 35%, transparent); }
  .pill { font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--line); }
  #files { font-size: 12.5px; color: var(--muted); }
  #files code { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); padding: 6px 16px; position: absolute; left: 0; bottom: 0; }
  @keyframes pulse { from { stroke-opacity: .9; r: 0.3; } to { stroke-opacity: 0; r: 1.6; } }
  .lookpulse { animation: pulse 1s ease-out infinite; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; height: auto; }
    #left { grid-template-rows: 55vh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    header a { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Nudge dossier agent</h1>
  <label>model <input id="sid" type="text" value="synthetic"></label>
  <button id="load">Load</button>
  <label>floor <select id="floor"></select></label>
  <button id="build" class="primary">Build dossier</button>
  <button id="demo">Demo run</button>
  <span id="status"></span>
  <a href="debug.html">route debugger</a>
</header>
<main>
  <div id="left">
    <div id="mapwrap">
      <svg id="map" role="img" aria-label="floor plan with hazards and landmarks"></svg>
      <div class="legend">
        <span style="color:var(--hazard)">◯ hazard</span>
        <span style="color:var(--writer)">◆ landmark</span>
        <span style="color:var(--look)">◉ agent looking</span>
        <span style="color:var(--hazard)">— edge marked hazard</span>
      </div>
    </div>
    <section id="briefing">
      <h2>Briefing <button id="read" style="margin-left:8px">Read aloud</button></h2>
      <p id="brieftext" class="meta">No dossier yet. Run the demo or build one.</p>
    </section>
  </div>
  <aside>
    <h2>Lead's plan</h2>
    <div id="plan"><span class="meta">waiting for write_todos</span></div>
    <h2>Activity</h2>
    <div id="feed"></div>
    <h2>Files in /dossier/</h2>
    <div id="files"></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const COLORS = { lead: "var(--lead)", "hazard-scout": "var(--scout)", "landmark-writer": "var(--writer)", "site-surveyor": "var(--site)" };
let G = null, D = null, floor = null, cursor = 0, polling = null, cards = {}, looking = null;

function status(t, err) { $("status").textContent = t || ""; $("status").className = err ? "err" : ""; }
async function api(path, opt) {
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

async function load() {
  const sid = $("sid").value.trim();
  status("loading…");
  try {
    await api(`/api/reload/${sid}`, { method: "POST" });
    G = await api(`/api/graph/${sid}`);
    D = await api(`/api/dossier/${sid}`);
  } catch (e) { status(e.message, true); return; }
  const sel = $("floor"), keep = sel.value;
  sel.innerHTML = G.floors.map(f => `<option value="${f.id}">${f.label}</option>`).join("");
  if (G.floors.some(f => f.id === keep)) sel.value = keep;
  floor = sel.value;
  renderDossier();
  draw();
  status(D.run && D.run.status === "running" ? "a run is in progress" : "");
  if (D.run && D.run.status === "running") startPolling();
}

function nodeById(id) { return G && G.nodes.find(n => n.id === id || n.label === id); }

function draw() {
  const svg = $("map");
  if (!G) return;
  const walls = (G.floors.find(f => f.id === floor) || { walls: [] }).walls;
  const nodes = G.nodes.filter(n => n.floor === floor);
  const xs = [], ys = [];
  walls.forEach(([a, b]) => { xs.push(a[0], b[0]); ys.push(a[1], b[1]); });
  nodes.forEach(n => { xs.push(n.x); ys.push(n.y); });
  if (!xs.length) { svg.innerHTML = ""; return; }
  const pad = 1.5, x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  svg.setAttribute("viewBox", `${x0} ${-y1} ${x1 - x0} ${y1 - y0}`);
  const P = (x, y) => `${x},${-y}`;
  let s = "";
  for (const [id, r] of Object.entries(G.rooms || {})) {
    if (r.floor !== floor || !r.poly || r.label === "Void") continue;
    s += `<polygon points="${r.poly.map(p => P(p[0], p[1])).join(" ")}" fill="var(--room)" stroke="none"/>`;
    const cx = r.poly.reduce((a, p) => a + p[0], 0) / r.poly.length, cy = r.poly.reduce((a, p) => a + p[1], 0) / r.poly.length;
    s += `<text x="${cx}" y="${-cy}" font-size="0.45" fill="var(--muted)" text-anchor="middle">${r.label}</text>`;
  }
  const byId = Object.fromEntries(G.nodes.map(n => [n.id, n]));
  for (const e of G.edges) {
    const a = byId[e.a], b = byId[e.b];
    if (!a || !b || a.floor !== floor || b.floor !== floor) continue;
    const hz = e.tags.includes("hazard");
    s += `<line x1="${a.x}" y1="${-a.y}" x2="${b.x}" y2="${-b.y}" stroke="${hz ? "var(--hazard)" : "var(--edge)"}" stroke-width="${hz ? 0.09 : 0.04}"/>`;
  }
  for (const [a, b, t] of walls) {
    const door = !["wall", "railing", "window", "glass"].includes(t);
    s += `<line x1="${a[0]}" y1="${-a[1]}" x2="${b[0]}" y2="${-b[1]}" stroke="${door ? "var(--door)" : "var(--wall)"}" stroke-width="${door ? 0.06 : 0.12}" ${door ? 'stroke-dasharray="0.15 0.1"' : ""} stroke-linecap="round"/>`;
  }
  for (const n of nodes) s += `<circle cx="${n.x}" cy="${-n.y}" r="0.12" fill="var(--muted)"><title>${n.label} · ${n.room_label || ""}</title></circle>`;
  // landmarks and hazards from the dossier
  const ann = D && D.annotations_json && !D.annotations_json.error ? D.annotations_json : null;
  if (ann) {
    for (const [pid, info] of Object.entries(ann.nodes || {})) {
      const n = byId[pid];
      if (!n || n.floor !== floor || !(info.landmarks || []).length) continue;
      const tip = info.landmarks.map(l => `${l.sense}: ${l.text}`).join("\n");
      s += `<g transform="translate(${n.x},${-n.y})"><rect x="-0.2" y="-0.2" width="0.4" height="0.4" transform="rotate(45)" fill="var(--writer)"/><title>${esc(tip)}</title></g>`;
    }
    for (const h of ann.hazards || []) {
      if (h.floor !== floor) continue;
      s += `<circle cx="${h.x}" cy="${-h.y}" r="${h.radius || 0.6}" fill="color-mix(in srgb, var(--hazard) 14%, transparent)" stroke="var(--hazard)" stroke-width="0.07"><title>${esc(h.kind)}: ${esc(h.note || "")}</title></circle>`;
      s += `<text x="${h.x}" y="${-h.y + 0.12}" font-size="0.42" text-anchor="middle" fill="var(--hazard)">!</text>`;
    }
  }
  // where the agent is looking right now
  if (looking) {
    const n = byId[looking.pano] || nodeById(looking.pano);
    if (n && n.floor === floor) {
      const yaw = (looking.yaw || 0) * Math.PI / 180, L = 2.2, half = 0.4;
      const p1 = [n.x + L * Math.cos(yaw - half), n.y + L * Math.sin(yaw - half)], p2 = [n.x + L * Math.cos(yaw + half), n.y + L * Math.sin(yaw + half)];
      s += `<polygon points="${P(n.x, n.y)} ${P(...p1)} ${P(...p2)}" fill="color-mix(in srgb, var(--look) 30%, transparent)" stroke="var(--look)" stroke-width="0.04"/>`;
      s += `<circle class="lookpulse" cx="${n.x}" cy="${-n.y}" r="0.3" fill="none" stroke="var(--look)" stroke-width="0.08"/>`;
      s += `<circle cx="${n.x}" cy="${-n.y}" r="0.2" fill="var(--look)"/>`;
    }
  }
  svg.innerHTML = s;
}

function esc(t) { return String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderDossier() {
  if (!D) return;
  $("brieftext").textContent = D.briefing_md || "No dossier yet. Run the demo or build one.";
  $("brieftext").className = D.briefing_md ? "" : "meta";
  const v = D.validation || {};
  $("files").innerHTML = (D.files || []).map(f => `<code>/dossier/${esc(f)}</code>`).join("") +
    (v.ok ? `<div style="margin-top:6px;color:var(--ok)">valid · ${v.hazards} hazards · ${v.landmarked_panos} landmarked panos · ${v.edges_marked_hazard} edges marked</div>`
          : (D.files || []).length ? `<div style="margin-top:6px;color:var(--hazard)">${esc((v.errors || []).join("; "))}</div>` : "<span>(empty)</span>");
}

function renderPlan(ev) {
  const t = ev.todos || [], done = t.filter(x => x.status === "completed").length;
  const mark = { completed: "✓", in_progress: "▸", pending: "·" };
  $("plan").innerHTML = `<span class="count">${done}/${t.length} done</span><ol>` +
    t.map(x => `<li class="${x.status}"><span class="m">${mark[x.status] || "·"}</span>${esc(x.content)}</li>`).join("") + "</ol>";
}

function row(ev) {
  const cls = ev.kind === "write" ? "write" : ev.kind === "look" ? "look" : ev.kind === "say" ? "say" : ev.kind === "error" ? "error" : "";
  const label = ev.kind === "write" ? `wrote <code>${esc(ev.path)}</code>` : ev.kind === "look" ? `looked from ${esc(ev.pano)} at ${Math.round(ev.yaw)}°${ev.pitch ? `, pitch ${ev.pitch}°` : ""}` : esc(ev.text);
  const d = document.createElement("div");
  d.className = `row ${cls}`;
  d.innerHTML = label;
  return d;
}

function onEvent(ev) {
  const feed = $("feed");
  if (ev.kind === "plan") { renderPlan(ev); return; }
  if (ev.kind === "delegate") {
    const c = document.createElement("div");
    c.className = "card running";
    c.innerHTML = `<div class="who"><i style="background:${COLORS[ev.subagent] || "var(--muted)"}"></i>${esc(ev.subagent)} <span class="pill">task()</span></div><div class="desc">${esc(ev.text)}</div><div class="body"></div>`;
    feed.appendChild(c);
    cards[ev.subagent] = c;
  } else if (ev.kind === "returned") {
    const c = cards[ev.who];
    if (c) { c.classList.remove("running"); c.insertAdjacentHTML("beforeend", `<div class="res">${esc(ev.text)}</div>`); delete cards[ev.who]; }
    looking = null;
  } else if (ev.who !== "lead" && cards[ev.who]) {
    cards[ev.who].querySelector(".body").appendChild(row(ev));
  } else {
    feed.appendChild(row(ev));
  }
  if (ev.kind === "look") {
    looking = ev;
    const n = nodeById(ev.pano);
    if (n && n.floor !== floor) { floor = n.floor; $("floor").value = floor; }  // follow the agent's eyes
  }
  if (ev.kind === "write" && /annotations\.json|briefing\.md/.test(ev.path || "")) refreshSoon();
  feed.parentElement.scrollTop = feed.parentElement.scrollHeight;
}

let refreshTimer = null;
function refreshSoon() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    const sid = $("sid").value.trim();
    try { await api(`/api/reload/${sid}`, { method: "POST" }); G = await api(`/api/graph/${sid}`); D = await api(`/api/dossier/${sid}`); renderDossier(); draw(); } catch (e) {}
  }, 300);
}

function startPolling() {
  clearInterval(polling);
  polling = setInterval(async () => {
    const sid = $("sid").value.trim();
    let r;
    try { r = await api(`/api/dossier/${sid}/events?after=${cursor}`); } catch (e) { status(e.message, true); return; }
    r.events.forEach(onEvent);
    cursor = r.next;
    draw();
    if (r.status !== "running") {
      clearInterval(polling);
      $("build").disabled = $("demo").disabled = false;
      status(r.status === "error" ? r.error : `${r.mode} run ${r.status}`, r.status === "error");
      looking = null;
      refreshSoon();
    }
  }, 400);
}

async function start(kind) {
  const sid = $("sid").value.trim();
  try {
    await api(`/api/dossier/${sid}/${kind}`, { method: "POST" });
  } catch (e) { status(e.message, true); return; }
  $("feed").innerHTML = ""; $("plan").innerHTML = '<span class="meta">waiting for write_todos</span>';
  cards = {}; cursor = 0; looking = null;
  if (kind === "demo") { D = { ...D, annotations_json: null, briefing_md: null, files: [], validation: {} }; renderDossier(); }
  $("build").disabled = $("demo").disabled = true;
  status(kind === "demo" ? "demo run: scripted model, real agent, real tools" : "building dossier…");
  startPolling();
}

$("load").onclick = load;
$("floor").onchange = (e) => { floor = e.target.value; draw(); };
$("build").onclick = () => start("run");
$("demo").onclick = () => start("demo");
$("read").onclick = () => {
  const t = $("brieftext").textContent;
  if (!("speechSynthesis" in window) || !D || !D.briefing_md) return;
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(t));
};
load();
</script>
</body>
</html>
