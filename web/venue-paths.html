<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isaac wayfinding</title>
<style>
  :root { --bg:#14161a; --panel:#1d2127; --line:#2c323b; --text:#e8ecf1; --dim:#9aa5b1; --route:#19d3ff; --go:#2fd27a; --end:#ff4fa3; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, "Segoe UI", Arial, sans-serif; }
  header { padding:14px 18px 6px; }
  h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; color:var(--dim); font-size:13px; }
  main { display:grid; grid-template-columns: 320px 1fr; gap:14px; padding:10px 18px 18px; align-items:start; }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; display:grid; gap:12px; }
  label { display:grid; gap:4px; font-size:13px; color:var(--dim); }
  select, button, input[type=range] { font:inherit; }
  select { background:#12151a; color:var(--text); border:1px solid var(--line); border-radius:7px; padding:7px 8px; width:100%; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { background:#262c35; color:var(--text); border:1px solid var(--line); border-radius:7px; padding:8px 12px; cursor:pointer; }
  button:hover { background:#303844; }
  button.on { background:var(--route); color:#04222b; border-color:var(--route); font-weight:600; }
  button.snap { background:var(--go); color:#06281a; border-color:var(--go); font-weight:700; flex:1; }
  .check { display:flex; align-items:center; gap:8px; color:var(--text); font-size:14px; }
  .check input { width:16px; height:16px; accent-color:var(--route); }
  #summary { background:#12151a; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:14px; }
  #summary b { color:var(--route); }
  #steps { margin:8px 0 0; padding-left:18px; color:var(--dim); font-size:13px; }
  #steps li { margin:2px 0; }
  .wrap { background:#0d0f12; border:1px solid var(--line); border-radius:10px; padding:8px; }
  canvas { display:block; max-width:100%; max-height:calc(100vh - 110px); width:auto; height:auto; margin:0 auto; border-radius:6px; cursor:crosshair; }
  .hint { color:var(--dim); font-size:12px; margin:0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding:10px 16px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Isaac wayfinding: routes on the building scan</h1>
  <p>Rabinowitz Hall, Matterport scan seen from above, with the walk graph the belt is guided along. Pick two places, then take a photo.</p>
</header>
<main>
  <aside>
    <div class="row" id="floorBtns"></div>
    <label>From<select id="from"></select></label>
    <label>To<select id="to"></select></label>
    <label>Between floors
      <select id="mode"><option value="any">Elevator or stairs, whichever is shorter</option><option value="elevator">Elevator only</option><option value="stairs">Stairs only</option></select>
    </label>
    <div id="summary"></div>
    <label>Walk along the route<input id="walk" type="range" min="0" max="1000" value="0"></label>
    <div class="row">
      <label class="check"><input id="showGraph" type="checkbox" checked>Walk graph</label>
      <label class="check"><input id="showNums" type="checkbox" checked>Node numbers</label>
      <label class="check"><input id="showNames" type="checkbox" checked>Place names</label>
      <label class="check"><input id="showTurns" type="checkbox" checked>Turn cues</label>
      <label class="check"><input id="dim" type="checkbox" checked>Dim the scan</label>
      <label class="check"><input id="caption" type="checkbox" checked>Caption in photo</label>
    </div>
    <div class="row">
      <button class="snap" id="snap">Snap photo</button>
      <button id="snapBoth">Both floors</button>
    </div>
    <p class="hint">Click a node on the map to set From, click another to set To. Photos save as PNG at full size.</p>
  </aside>
  <div class="wrap"><canvas id="c"></canvas></div>
</main>

function shortest(a, b, mode) {
  const dist = N.map(() => Infinity), prev = N.map(() => null), done = N.map(() => false);
  dist[a] = 0;
  for (;;) {
    let u = -1;
    for (let i = 0; i < N.length; i++) if (!done[i] && dist[i] < Infinity && (u < 0 || dist[i] < dist[u])) u = i;
    if (u < 0 || u === b) break;
    done[u] = true;
    for (const [v, ei] of adj[u]) {

      if ((mode === 'elevator' && k === 'stairs') || (mode === 'stairs' && k === 'elevator')) continue;
      if (dist[u] + E[ei].len < dist[v]) { dist[v] = dist[u] + E[ei].len; prev[v] = [u, ei]; }
    }
  }
  if (dist[b] === Infinity) return null;
  const hops = [];
  for (let v = b; v !== a; v = prev[v][0]) hops.unshift({ a: prev[v][0], b: v, e: E[prev[v][1]] });

function build() {

  let m = 0;

function where(d) {                 // position after d metres
  if (!route || !route.segs.length) return null;
  for (const s of route.segs) {
    if (d > s.m1 && s !== route.segs[route.segs.length - 1]) continue;

    if (s.link) { const n = N[t < 0.5 ? s.at : s.to]; return { floor: n.f, p: [n.px, n.py], dir: null, riding: s.link }; }
    let px = 0; const L = [0];
    for (let i = 1; i < s.pts.length; i++) { px += Math.hypot(s.pts[i][0]-s.pts[i-1][0], s.pts[i][1]-s.pts[i-1][1]); L.push(px); }
    const want = t * px;
    for (let i = 1; i < s.pts.length; i++) if (want <= L[i] || i === s.pts.length - 1) {
      const u = (want - L[i-1]) / Math.max(1e-6, L[i] - L[i-1]), a = s.pts[i-1], b = s.pts[i];

    }
  }
  return null;
}

function pill(c, text, x, y, o = {}) {

        for (let s = carry; s < len; s += 68) {
          const x = a[0] + (b[0]-a[0]) * s/len, y = a[1] + (b[1]-a[1]) * s/len;
          c.save(); c.translate(x, y); c.rotate(ang); c.beginPath(); c.moveTo(-7, -8); c.lineTo(5, 0); c.lineTo(-7, 8);
          c.strokeStyle = '#04222b'; c.lineWidth = 4; c.stroke(); c.restore();
        }
        carry = ((carry - len) % 68 + 68) % 68;
      }
    }
  }
  if ($('showGraph').checked) {
    const onRoute = new Set(r ? r.hops.flatMap(h => [h.a, h.b]) : []);
    for (let i = 0; i < N.length; i++) {
      const n = N[i]; if (n.f !== fl) continue;
      const col = n.tags.includes('elevator') ? '#e23b3b' : n.tags.includes('stairs') ? '#f08a00' : onRoute.has(i) ? '#0b8fb3' : '#2b6fd6';
      c.beginPath(); c.arc(n.px, n.py, 15, 0, 7); c.fillStyle = col; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.stroke();
      if ($('showNums').checked) { c.fillStyle = '#fff'; c.font = '700 15px system-ui, Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(i, n.px, n.py + 1); }
    }
  }
  if ($('showNames').checked) for (const p of F[fl].places) pill(c, p.name, p.x, p.y, { size: 19 });
  if (r) {
    if ($('showTurns').checked) for (const t of r.turns) {
      if (t.floor !== fl) continue;
      pill(c, (t.side === 'right' ? 'Right ↱ ' : '↰ Left ') + Math.round(Math.abs(t.deg)) + '°', t.p[0], t.p[1] - 40, { size: 19, bg: '#ffd23f', fg: '#201a00' });
    }
    for (const l of r.links) {
      const up = N[l.to].f > N[l.at].f, word = title(l.link) + (up ? ' up' : ' down');
      if (N[l.at].f === fl) pill(c, word + ' to ' + F[N[l.to].f].name, N[l.at].px, N[l.at].py + 40, { size: 19, bg: '#e23b3b' });
      if (N[l.to].f === fl) pill(c, 'From ' + F[N[l.at].f].name + ' by ' + l.link, N[l.to].px, N[l.to].py + 40, { size: 19, bg: '#e23b3b' });
    }
    const pin = (n, text, col) => { if (N[n].f !== fl) return;
      c.beginPath(); c.arc(N[n].px, N[n].py, 23, 0, 7); c.fillStyle = col; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 4; c.stroke();
      c.fillStyle = '#fff'; c.font = '800 22px system-ui, Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, N[n].px, N[n].py + 1); };
    pin(from, 'A', '#17a05a'); pin(to, 'B', '#e0338a');
    const w = walkM > 0 ? where(walkM) : null;
    if (w && w.floor === fl) {
      c.save(); c.translate(w.p[0], w.p[1]);
      c.beginPath(); c.arc(0, 0, 19, 0, 7); c.fillStyle = '#fff'; c.fill(); c.strokeStyle = '#19d3ff'; c.lineWidth = 6; c.stroke();
      if (w.dir !== null) { c.rotate(w.dir); c.beginPath(); c.moveTo(34, 0); c.lineTo(16, -12); c.lineTo(16, 12); c.closePath(); c.fillStyle = '#19d3ff'; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke(); }
      c.restore();
      const next = r.turns.find(t => t.at > walkM + 0.05);
      const cue = w.riding ? 'In the ' + (w.riding === 'elevator' ? 'elevator' : 'stairwell')
        : next && next.at - walkM < 1.5 ? 'Belt taps ' + next.side + ' now'
        : next ? title(next.side) + ' turn in ' + (next.at - walkM).toFixed(1) + ' m'
        : (r.total - walkM < 1 ? 'Arrived: both sides tap' : 'Straight on, ' + (r.total - walkM).toFixed(1) + ' m to go');
      pill(c, cue, Math.max(170, Math.min(W - 170, w.p[0])), w.p[1] - 46, { size: 21, bg: '#19d3ff', fg: '#04222b' });
    }
  }
  if (withCaption) {
    c.fillStyle = '#0d0f12'; c.fillRect(0, H, W, CAP);
    c.textBaseline = 'middle'; c.textAlign = 'left'; c.fillStyle = '#fff'; c.font = '700 26px system-ui, "Segoe UI", Arial';
    const head = 'Isaac  ·  ' + title(F[fl].name);
    c.fillText(head, 22, H + 26);
    c.font = '20px system-ui, "Segoe UI", Arial'; c.fillStyle = '#b9c3ce';
    c.fillText(r ? N[from].place + ' (' + from + ') to ' + N[to].place + ' (' + to + ')  ·  ' + r.total.toFixed(1) + ' m  ·  ' + r.turns.length + (r.turns.length === 1 ? ' turn' : ' turns') + (r.links.length ? '  ·  ' + r.links.map(l => l.link).join(', ') : '')
      : 'Walk graph: ' + N.filter(n => n.f === fl).length + ' scan positions on this floor', 22, H + 54);
    c.textAlign = 'right'; c.fillStyle = '#7f8a96'; c.font = '17px system-ui, Arial';
    c.fillText('Rabinowitz Hall, Matterport scan  ·  shortest route on the walk graph', W - 22, H + 54);
  }
}

function draw() {
  const cap = $('caption').checked;
  cv.width = W; cv.height = H + (cap ? CAP : 0);
  const m = route ? route.total * $('walk').value / 1000 : 0;
  const w = m > 0 ? where(m) : null;
  if (w && w.floor !== floor && followWalker) { floor = w.floor; floorButtons(); }
  paint(cx, floor, m, cap);
  const r = route;
  $('summary').innerHTML = !r ? 'No route between these two with that setting.'
    : !r.segs.length ? 'Pick two different places.'
    : '<b>' + r.total.toFixed(1) + ' m</b>, ' + r.hops.length + ' graph edges, ' + r.turns.length + (r.turns.length === 1 ? ' turn' : ' turns') +
      (r.links.length ? ', ' + r.links.map(l => l.link).join(' and ') : ', one floor') +
      '<ol id="steps">' + steps(r).map(s => '<li>' + s + '</li>').join('') + '</ol>';
}
let followWalker = false;

function steps(r) {
  const out = [], marks = [...r.turns.map(t => ({ at: t.at, text: 'Turn ' + t.side + ' (belt taps ' + t.side + ')' })),
    ...r.links.map(l => ({ at: l.m0, text: 'Take the ' + l.link + ' to ' + F[N[l.to].f].name }))].sort((a, b) => a.at - b.at);
  let last = 0;
  for (const k of marks) { if (k.at - last > 0.3) out.push('Walk ' + (k.at - last).toFixed(1) + ' m'); out.push(k.text); last = k.at; }
  if (r.total - last > 0.3) out.push('Walk ' + (r.total - last).toFixed(1) + ' m');
  out.push('Arrive at ' + N[to].place + ' (both sides tap)');
  return out;
}

function floorButtons() {
  $('floorBtns').innerHTML = '';
  F.forEach((f, i) => { const b = document.createElement('button'); b.textContent = title(f.name); if (i === floor) b.className = 'on';
    b.onclick = () => { floor = i; followWalker = false; floorButtons(); draw(); }; $('floorBtns').appendChild(b); });
}
function fill(sel, v) {
  sel.innerHTML = '';
  F.forEach((f, fi) => { const g = document.createElement('optgroup'); g.label = title(f.name);
    N.map((n, i) => [n, i]).filter(([n]) => n.f === fi).sort((a, b) => a[0].place.localeCompare(b[0].place) || a[1] - b[1])
      .forEach(([n, i]) => { const o = document.createElement('option'); o.value = i; o.textContent = name(i); g.appendChild(o); });
    sel.appendChild(g); });
  sel.value = v;
}
function update(showStart) { build(); if (showStart) { floor = N[from].f; floorButtons(); } draw(); }
$('from').onchange = e => { from = +e.target.value; $('walk').value = 0; update(true); };
$('to').onchange = e => { to = +e.target.value; $('walk').value = 0; update(true); };
$('mode').onchange = () => update(false);
$('walk').oninput = () => { followWalker = true; draw(); };
['showGraph', 'showNums', 'showNames', 'showTurns', 'dim', 'caption'].forEach(id => $(id).onchange = draw);
let pickNext = 'from';
cv.onclick = ev => {
  const b = cv.getBoundingClientRect(), x = (ev.clientX - b.left) * cv.width / b.width, y = (ev.clientY - b.top) * cv.height / b.height;
  let best = -1, bd = 34;
  N.forEach((n, i) => { if (n.f !== floor) return; const d = Math.hypot(n.px - x, n.py - y); if (d < bd) { bd = d; best = i; } });
  if (best < 0) return;
  if (pickNext === 'from') { from = best; $('from').value = best; pickNext = 'to'; } else { to = best; $('to').value = best; pickNext = 'from'; }
  $('walk').value = 0; build(); draw();
};
function save(canvas, tag) {
  canvas.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'isaac-route-' + from + '-to-' + to + '-' + tag + '.png'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, 'image/png');
}
$('snap').onclick = () => save(cv, F[floor].name.replace(/\W+/g, '-'));
$('snapBoth').onclick = () => {
  const cap = $('caption').checked, h = H + (cap ? CAP : 0), big = document.createElement('canvas'), gap = 16;
  big.width = W * F.length + gap * (F.length - 1); big.height = h;
  const g = big.getContext('2d'); g.fillStyle = '#0d0f12'; g.fillRect(0, 0, big.width, big.height);
  const m = route ? route.total * $('walk').value / 1000 : 0;
  F.forEach((f, i) => { const t = document.createElement('canvas'); t.width = W; t.height = H + CAP; paint(t.getContext('2d'), i, m, cap); g.drawImage(t, 0, 0, W, h, i * (W + gap), 0, W, h); });
  save(big, 'both-floors');
};
fill($('from'), from); fill($('to'), to); floorButtons(); build(); draw();
</script>
</body>
</html>
